function App(){
  // ── Effacer la sauvegarde quand on fait un vrai reset
  const clearSave=()=>{
    ['ptg_screen','ptg_count','ptg_activeRoles','ptg_players','ptg_nightCount','ptg_lastNight','ptg_voleurRole','ptg_lastSalvateur','ptg_variants']
      .forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  };

  // Bloquer le menu contextuel + refresh + retour arrière
  React.useEffect(()=>{
    // Bloquer clic droit / appui long contextuel
    const prevent=e=>e.preventDefault();
    document.addEventListener('contextmenu',prevent);

    // Bloquer refresh (F5, Ctrl+R, fermeture onglet, retour navigateur)
    const beforeUnload=e=>{
      e.preventDefault();
      e.returnValue='La partie en cours sera perdue. Continuer ?';
      return e.returnValue;
    };
    window.addEventListener('beforeunload',beforeUnload);

    // Bloquer le retour arrière (history back)
    // Pousser un état dans l'historique et l'y maintenir
    window.history.pushState(null,'',window.location.href);
    const blockBack=e=>{
      window.history.pushState(null,'',window.location.href);
    };
    window.addEventListener('popstate',blockBack);

    // Bloquer le swipe retour (iOS Safari / Android Chrome)
    // en empêchant le overscroll horizontal
    let touchStartX=0;
    const onTouchStart=e=>{touchStartX=e.touches[0].clientX;};
    const onTouchMove=e=>{
      const dx=e.touches[0].clientX-touchStartX;
      // Si swipe horizontal depuis les bords (30px) → bloquer
      if((touchStartX<30&&dx>0)||(touchStartX>window.innerWidth-30&&dx<0)){
        e.preventDefault();
      }
    };
    document.addEventListener('touchstart',onTouchStart,{passive:true});
    document.addEventListener('touchmove',onTouchMove,{passive:false});

    return()=>{
      document.removeEventListener('contextmenu',prevent);
      window.removeEventListener('beforeunload',beforeUnload);
      window.removeEventListener('popstate',blockBack);
      document.removeEventListener('touchstart',onTouchStart);
      document.removeEventListener('touchmove',onTouchMove);
    };
  },[]);
  // Charger la sauvegarde locale au démarrage
  const loadSave=key=>{ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } };
  const save=(key,val)=>{ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} };

  const [screen,setScreen]=useState(()=>loadSave('ptg_screen')||'count');
  const [count,setCount]=useState(()=>loadSave('ptg_count')||8);
  const [activeRoles,setActiveRoles]=useState(()=>loadSave('ptg_activeRoles')||{});
  const [players,setPlayers]=useState(()=>loadSave('ptg_players')||Array.from({length:8},(_,i)=>mkP(i+1)));
  const [selId,setSelId]=useState(null);
  const [showNight,setShowNight]=useState(false);
  const [nightIdx,setNightIdx]=useState(0);
  const [showEveryNight,setShowEveryNight]=useState(false);
  const [everyNightIdx,setEveryNightIdx]=useState(0);
  const [nightCount,setNightCount]=useState(()=>loadSave('ptg_nightCount')||1);
  const [na,setNaState]=useState(mkNA);
  const [lastNight,setLastNight]=useState(()=>loadSave('ptg_lastNight')||null);
  const [lastSalvateurTarget,setLastSalvateurTarget]=useState(()=>loadSave('ptg_lastSalvateur')||null); // joueur protégé le tour précédent
  const [voleurChosenRole,setVoleurChosenRole]=useState(()=>loadSave('ptg_voleurRole')||null);
  const [dragIdx,setDragIdx]=useState(null); // drag liste joueurs écran rôles seulement
  const [showReorder,setShowReorder]=useState(false); // modal réorganisation table
  const [playersFolded,setPlayersFolded]=useState(false); // liste joueurs repliée (portrait)
  const [servanteAsk,setServanteAsk]=useState(null); // joueur éliminé : la Servante prend-elle sa place ?
  const [variants,setVariants]=useState(()=>loadSave('ptg_variants')||{}); // rôles joués en variante maison
  const [theme,setTheme]=useState(()=>loadSave('ptg_theme')||'nuit'); // ambiance : 'nuit' (étoilée) ou 'gold' (noir & or)
  const [variantAsk,setVariantAsk]=useState(null); // choix version normale / variante (écran rôles)
  const [shotTarget,setShotTarget]=useState(''); // Tireur d'élite : cible choisie
  const [shotResult,setShotResult]=useState(null); // Tireur d'élite : résultat du tir
  const svgRef=React.useRef(null);
  const [tooltip,setTooltip]=useState(null);
  const [showReset,setShowReset]=useState(false);
  const [resetKeep,setResetKeep]=useState([]);

  // ── Ambiance (préférence conservée même après une nouvelle partie)
  React.useEffect(()=>{
    save('ptg_theme',theme);
    if(theme==='gold') document.documentElement.setAttribute('data-theme','gold'); else document.documentElement.removeAttribute('data-theme');
    const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',theme==='gold'?'#050403':'#06071a');
  },[theme]);

  // ── SAUVEGARDE AUTOMATIQUE dans localStorage
  React.useEffect(()=>{
    save('ptg_screen',screen);
    save('ptg_count',count);
    save('ptg_activeRoles',activeRoles);
    save('ptg_players',players);
    save('ptg_nightCount',nightCount);
    save('ptg_lastNight',lastNight);
    save('ptg_voleurRole',voleurChosenRole);
    save('ptg_lastSalvateur',lastSalvateurTarget);
    save('ptg_variants',variants);
  },[screen,count,activeRoles,players,nightCount,lastNight,voleurChosenRole,lastSalvateurTarget,variants]);


  useEffect(()=>{
    setPlayers(prev=>{
      if(count>prev.length) return [...prev,...Array.from({length:count-prev.length},(_,i)=>mkP(prev.length+i+1))];
      return prev.slice(0,count);
    });
  },[count]);

  const totalR=Object.entries(activeRoles).reduce((s,[k,v])=>s+v*(k==='TROIS_FRERES'?3:k==='DEUX_SOEURS'?2:1),0);
  const voleurBonus2=(activeRoles['VOLEUR']||0)*2; // 2 cartes bonus pour le Voleur
  const rem=(count+voleurBonus2)-totalR;

  // Poids de chaque rôle (nombre de joueurs qu'il occupe)
  const roleWeight=rk=>rk==='TROIS_FRERES'?3:rk==='DEUX_SOEURS'?2:1;
  // Slots bonus accordés au meneur (Voleur nécessite 2 cartes supplémentaires)
  const voleurBonus=(activeRoles['VOLEUR']||0)*2;
  const totalRSlots=Object.entries(activeRoles).reduce((s,[k,v])=>s+v*roleWeight(k),0);

  const toggleRole=rk=>{
    const w=roleWeight(rk);
    setActiveRoles(prev=>{
      const cur=prev[rk]||0;
      const tot=Object.entries(prev).reduce((s,[k,v])=>s+v*roleWeight(k),0);
      // Clic gauche = ajouter si de la place, sinon retirer un
      if(tot+w<=count) return {...prev,[rk]:(cur||0)+1};
      if(cur>0){
        const next=cur-1;
        if(next===0){const{[rk]:_,...rest}=prev;return rest;}
        return {...prev,[rk]:next};
      }
      return prev;
    });
  };

  // Bear growl
  const bearGrowl=useMemo(()=>{
    const s={};
    players.forEach(p=>{
      if(p.role!=='MONTREUR_OURS') return;
      if(p.powerless){s[p.id]=false;return;}
      const idx=players.findIndex(x=>x.id===p.id);
      let L=null,R=null;
      for(let i=1;i<=players.length;i++){const ci=(idx-i+players.length)%players.length;if(players[ci].alive&&players[ci].id!==p.id){L=players[ci];break;}}
      for(let i=1;i<=players.length;i++){const ci=(idx+i)%players.length;if(players[ci].alive&&players[ci].id!==p.id){R=players[ci];break;}}
      s[p.id]=(L&&isWolf(L))||(R&&isWolf(R));
    });
    return s;
  },[players.map(p=>`${p.id}-${p.alive}-${p.role}-${p.team}-${p.turnedWolf}-${p.isInfected}-${p.powerless}`).join(',')]);

  useEffect(()=>{
    setPlayers(prev=>prev.map(p=>{
      if(p.role!=='MONTREUR_OURS') return p;
      const g=!!bearGrowl[p.id];
      return p.bearGrowl!==g?{...p,bearGrowl:g}:p;
    }));
  },[bearGrowl]);

  const stats=useMemo(()=>{
    const alive=players.filter(p=>p.alive);
    return{alive:alive.length,wolves:alive.filter(isWolf).length,village:alive.filter(p=>ROLES[p.role]?.team==='village'||ROLES[p.role]?.team==='variable').length};
  },[players.map(p=>`${p.id}-${p.alive}-${p.role}-${p.team}-${p.isInfected}-${p.turnedWolf}`).join(',')]);

  const toggleAlive=id=>{
    setPlayers(prev=>{
      const pl=prev.find(p=>p.id===id),nxt=!pl.alive;
      return prev.map(p=>{
        if(p.id===id) return{...p,alive:nxt};
        // Amoureux : si le joueur meurt, son amoureux meurt aussi
        if(!nxt&&pl.lover&&p.id===pl.loverId) return{...p,alive:false};
        // Enfant sauvage : si son modèle meurt, il devient loup
        if(!nxt&&p.role==='ENFANT_SAUVAGE'&&p.alive&&p.model===id) return{...p,turnedWolf:true,team:'loups'};
        return p;
      });
    });
  };

  // Servante Dévouée : prend la place et le rôle du joueur éliminé par le vote
  const servanteTakes=deadId=>{
    setPlayers(prev=>{
      const dead=prev.find(p=>p.id===deadId);
      const serv=prev.find(p=>p.role==='SERVANTE'&&p.alive&&p.id!==deadId);
      if(!dead||!serv) return prev;
      const r=dead.role;
      const keep=r==='MARIONNETTISTE'||r==='IDIOT'||r==='COMEDIEN'; // états conservés
      return prev.map(p=>{
        if(p.id===deadId) return {...p,alive:false};
        if(p.id===serv.id){
          if(p.lover&&p.loverId===deadId) return {...p,alive:false}; // meurt de chagrin
          return {...p,role:r,team:r==='CHIEN_LOUP'?dead.team:(ROLES[r]?.team||null),isInfected:false,powerless:false,
            potionLifeUsed:false,potionDeathUsed:false,foxPower:true,infectUsed:false,singeUsed:false,
            marionnetteUsed:keep?dead.marionnetteUsed:false,mute:keep?dead.mute:false,
            model:r==='ENFANT_SAUVAGE'?dead.model:null,turnedWolf:r==='ENFANT_SAUVAGE'?dead.turnedWolf:false,
            angelTarget:r==='ANGE_DECHU'?dead.angelTarget:null};
        }
        if(dead.lover&&p.id===dead.loverId) return {...p,alive:false};
        if(p.role==='ENFANT_SAUVAGE'&&p.alive&&p.model===deadId) return {...p,turnedWolf:true,team:'loups'};
        return p;
      });
    });
  };

  // Tireur d'élite : tir de jour. Loup → le Tireur survit ; sinon il meurt avec sa cible
  const tireurShoot=(shooterId,targetId)=>{
    const shooter=players.find(p=>p.id===shooterId),target=players.find(p=>p.id===targetId);
    if(!shooter||!target) return;
    const wolf=isWolf(target);
    const ids=wolf?[targetId]:[targetId,shooterId];
    const dead=new Set(ids),chain=[];
    let grow=true;
    while(grow){grow=false;players.forEach(p=>{if(dead.has(p.id)&&p.lover&&p.loverId&&!dead.has(p.loverId)){const o=players.find(x=>x.id===p.loverId);if(o&&o.alive){dead.add(o.id);chain.push(o.id);grow=true;}}});}
    setPlayers(prev=>prev.map(p=>{
      let u=p;
      if(p.id===shooterId) u={...u,shotUsed:true};
      if(dead.has(p.id)) u={...u,alive:false};
      if(u.role==='ENFANT_SAUVAGE'&&u.alive&&dead.has(u.model)) u={...u,turnedWolf:true,team:'loups'};
      return u;
    }));
    setShotResult({shooterId,targetId,wolf,chain});
    setShotTarget('');
  };

  const setNA=u=>setNaState(prev=>({...prev,...u}));

  const nightSlides=useMemo(()=>{
    const slides=FIRST_NIGHT.filter(s=>{
      if(s.role==='LOVER') return activeRoles['CUPIDON']>0;
      if(s.role==='CHARMED') return activeRoles['JOUEUR_FLUTE']>0;
      if(s.role==='LEURRE_INFECT') return activeRoles['INFECT_PERE']>0;
      if(s.role==='COLOSSE_RIPOSTE') return activeRoles['COLOSSE']>0;
      if(s.role==='LOUP') return players.some(p=>p.alive&&isWolf(p)) || Object.keys(activeRoles).some(k=>ROLES[k]?.team==='loups');
      return activeRoles[s.role]>0;
    });
    return[...slides,{role:'RECAP',name:'Récap de la Nuit',note:''}];
  },[activeRoles]);

  // Slides pour chaque nuit (filtrés par joueur vivant)
  const everyNightSlides=useMemo(()=>{
    const loupBlancActif=nightCount%2===0; // Se réveille nuits paires (2,4,6...)
    const EVERY_NIGHT_DETAIL=[
      {role:'LOVER',     name:'Les Amoureux', note:'Se réveillent ensemble : 30 secondes pour se parler par gestes, sans aucun bruit.'},
      {role:'COMEDIEN',  name:'Comédien',    note:'Choisit un pouvoir parmi les cartes au centre.'},
      {role:'SINGE_SAVANT',name:'Singe Savant',note:'Sort-il de sa cage cette nuit ? Une seule fois dans la partie.'},
      {role:'VOYANTE',   name:'Voyante',     note:"Regarde secrètement la carte d'un joueur."},
      {role:'CORBEAU',   name:'Corbeau',     note:'Désigne un joueur qui aura +2 voix au prochain vote.'},
      {role:'SALVATORE', name:'Salvateur',   note:'Désigne un joueur à protéger cette nuit.'},
      {role:'LOUP',      name:'Tous les Loups-Garous', note:'Choisissent leur victime.'},
      {role:'PUISSANTE_MERE',name:'Puissante Mère des Loups',note:'Se réveille seule et retire son pouvoir à un Villageois.'},
      {role:'INFECT_PERE',name:'Infect Père des Loups',note:'Peut transformer la victime en loup.'},
      {role:'LEURRE_INFECT',name:'Réveil Infecté',note:'Réveillez discrètement la personne infectée par l\'Infect Père.',emoji:'🦠'},
      {role:'GRAND_MECHANT_LOUP',name:'Grand Méchant Loup',note:"Peut désigner une 2ème victime."},
      {role:'LOUP_BLANC', name:'Loup Blanc', note:loupBlancActif?'Cette nuit il peut tuer un loup de son choix (non obligatoire).':'Nuit de repos — le Loup Blanc ne se réveille pas cette nuit.', actif:loupBlancActif},
      {role:'RENARD',    name:'Renard',      note:'Inspecte 3 joueurs adjacents.'},
      {role:'SORCIERE',  name:'Sorcière',    note:'Voit la victime. Peut utiliser ses potions.'},
      {role:'JOUEUR_FLUTE',name:'Joueur de Flûte',note:'Enchante 2 joueurs de son choix.'},
      {role:'CHARMED',   name:'Joueurs Charmés',note:'Les joueurs charmés se reconnaissent.'},
      {role:'COLOSSE_RIPOSTE',name:'Colosse',note:"Uniquement s'il a été dévoré par les Loups cette nuit."},
    ];
    const hasAlivePlayers=rk=>{
      if(rk==='LOUP') return players.some(p=>p.alive&&isWolf(p));
      if(rk==='CHARMED') return players.some(p=>p.alive&&p.enchanted);
      return players.some(p=>p.alive&&p.role===rk);
    };
    // Rôles qui nécessitent obligatoirement un joueur vivant pour être appelés
    const NEEDS_ALIVE_PLAYER=['VOYANTE','CORBEAU','SALVATORE','SORCIERE','RENARD','COMEDIEN',
      'INFECT_PERE','GRAND_MECHANT_LOUP','JOUEUR_FLUTE','SINGE_SAVANT'];

    const slides=EVERY_NIGHT_DETAIL.filter(s=>{
      if(s.role==='LOVER') return activeRoles['CUPIDON']>0 && !!variants.CUPIDON && players.filter(p=>p.alive&&p.lover).length===2;
      if(s.role==='CHARMED') return activeRoles['JOUEUR_FLUTE']>0 && players.some(p=>p.alive&&p.enchanted);
      if(s.role==='LEURRE_INFECT') return activeRoles['INFECT_PERE']>0 && players.some(p=>p.alive&&p.role==='INFECT_PERE');
      if(s.role==='LOUP') return players.some(p=>p.alive&&isWolf(p)); // inclus si au moins 1 loup vivant (rôle OU transformation manuelle)
      if(s.role==='LOUP_BLANC') return activeRoles['LOUP_BLANC']>0 && players.some(p=>p.alive&&p.role==='LOUP_BLANC');
      if(s.role==='PUISSANTE_MERE') return nightCount<=2 && activeRoles['PUISSANTE_MERE']>0 && players.some(p=>p.alive&&p.role==='PUISSANTE_MERE');
      if(s.role==='COLOSSE_RIPOSTE') return activeRoles['COLOSSE']>0 && players.some(p=>p.alive&&p.role==='COLOSSE');
      // Rôles nécessitant un joueur vivant : on vérifie qu'il est bien en vie
      if(NEEDS_ALIVE_PLAYER.includes(s.role)) return activeRoles[s.role]>0 && hasAlivePlayers(s.role);
      // Autres rôles bonus (sans joueur assigné) : juste vérifier activeRoles
      return activeRoles[s.role]>0;
    });
    return [...slides,{role:'RECAP',name:'Récap de la Nuit',note:''}];
  },[activeRoles, nightCount, variants, players.map(p=>`${p.id}-${p.alive}-${p.role}-${p.lover}`).join(',')]);

  const applyNight=()=>{
    const out=computeNight(players,na);
    // Un seul setPlayers qui gère TOUT
    setPlayers(prev => {
      const justDied=new Set(out.dead);
      const mereT=prev.find(p=>p.id===na.mereTarget);
      const mereHits=hasVillagePower(mereT);
      return prev.map(p => {
        let u = {...p};

        // Morts de la nuit (loups, GMG, potion, Loup Blanc, Singe, riposte du Colosse, chagrin)
        if(justDied.has(p.id)) u.alive = false;

        // Divorce des amoureux : le lien est rompu pour les deux
        if(out.divorcedIds.includes(p.id)){ u.lover=false; u.loverId=null; }

        // Victime des loups infectée
        if(out.infected && p.id===na.wolfVictim){ u.isInfected=true; u.team='loups'; u.alive=true; }

        // Marionnettiste : sa marionnette meurt à sa place
        if(out.puppet===p.id){ u.alive=true; u.marionnetteUsed=true; u.mute=true; }

        // Puissante Mère des Loups : le Villageois ciblé perd son pouvoir
        if(mereHits && p.id===na.mereTarget) u.powerless=true;

        // Singe Savant : pouvoir consommé s'il est sorti
        if(p.role==='SINGE_SAVANT' && na.singeOut) u.singeUsed=true;

        // Effets non-mortels
        if(p.id===na.corbeauTarget) u.cursed=true;
        if(na.newEnchanted && na.newEnchanted.includes(p.id)) u.enchanted=true;
        if(p.id===na.salvateurTarget) u.protected=true;

        // Infect père : marquer pouvoir utilisé
        if(p.role==='INFECT_PERE' && na.infectTransform) u.infectUsed=true;

        // Sorcière : potions utilisées de façon PERMANENTE
        if(p.role==='SORCIERE') {
          if(na.potionLifeUsed) u.potionLifeUsed=true;
          if(na.potionDeathTarget) u.potionDeathUsed=true;
        }

        // Renard : perd son pouvoir si aucun loup parmi ses 3 cibles
        if(p.role==='RENARD' && p.alive && na.renardTargets.some(id=>id!==null)) {
          const hasWolf = na.renardTargets.some(id=>{const t=prev.find(x=>x.id===id);return t&&isWolf(t);});
          if(!hasWolf) u.foxPower=false;
        }

        // Enfant sauvage : si son modèle meurt cette nuit, devient loup
        if(u.role==='ENFANT_SAUVAGE' && u.alive && u.model && justDied.has(u.model)) {
          u.turnedWolf=true; u.team='loups';
        }

        return u;
      });
    });
    // Sauvegarder le récap avant de reset
    const salSaved2=na.salvateurTarget&&na.wolfVictim&&na.salvateurTarget===na.wolfVictim;
    const psaved2=na.potionLifeUsed&&na.wolfVictim;
    // Capturer l'état AVANT reset pour le récap complet
    const enchantedThisNight=players.filter(p=>p.enchanted&&p.alive);
    const chienLoupPlayer=players.find(p=>p.role==='CHIEN_LOUP');
    const angeDechuPlayer=players.find(p=>p.role==='ANGE_DECHU');
    const renardPlayer2=players.find(p=>p.role==='RENARD'&&p.alive);
    // Capturer données supplémentaires
    const cupidonPlayer=players.find(p=>p.role==='CUPIDON');
    const lovers=players.filter(p=>p.lover);
    const voleurPlayer=players.find(p=>p.role==='VOLEUR'||voleurChosenRole);
    const comedienPlayer=players.find(p=>p.role==='COMEDIEN');
    const ancienPlayer=players.find(p=>p.role==='ANCIEN');
    const sorcierePlayer=players.find(p=>p.role==='SORCIERE');
    const esPlayer=players.find(p=>p.role==='ENFANT_SAUVAGE');
    const flutePlayer=players.find(p=>p.role==='JOUEUR_FLUTE');
    setLastNight({
      nightNumber:nightCount,
      isFirstNight:nightCount===1,
      // Loups
      wolfVictimId:na.wolfVictim,
      wolfVictimSaved:salSaved2||psaved2,
      saviorType:salSaved2?'salvateur':psaved2?'potion':null,
      gmgVictimId:na.gmgVictim,
      infectTransformed:out.infected?na.wolfVictim:null,
      loupBlancId:na.loupBlancTarget,
      // Village
      salvateurId:na.salvateurTarget,
      corbeauId:na.corbeauTarget,
      potionDeathId:na.potionDeathTarget,
      potionLifeUsed:na.potionLifeUsed&&!!na.wolfVictim,
      potionLifeTargetId:na.potionLifeUsed?na.wolfVictim:null,
      voyanteTargetId:na.voyanteTarget,
      voyanteTargetIsWolf:na.voyanteTarget?isWolf(players.find(p=>p.id===na.voyanteTarget)||{}):null,
      renardTargetIds:na.renardTargets.filter(Boolean),
      renardResult:na.renardTargets.some(id=>id!==null)?na.renardTargets.some(id=>{const t=players.find(p=>p.id===id);return t&&isWolf(t);}):null,
      renardLostPower:renardPlayer2&&na.renardTargets.some(id=>id!==null)&&!na.renardTargets.some(id=>{const t=players.find(p=>p.id===id);return t&&isWolf(t);}),
      // Flûte
      newEnchantedIds:na.newEnchanted.filter(Boolean),
      enchantedIds:[...new Set([...enchantedThisNight.map(p=>p.id),...na.newEnchanted.filter(Boolean)])],
      flutePlayerId:flutePlayer?.id,
      // Cupidon
      cupidonId:cupidonPlayer?.id,
      loversIds:lovers.map(p=>p.id),
      // Voleur
      voleurId:players.find(p=>p.role==='VOLEUR')?.id,
      voleurChosenRole:voleurChosenRole||null,
      // Comédien
      comedienId:comedienPlayer?.id,
      // Chien-Loup
      chienLoupId:chienLoupPlayer?.id,
      chienLoupCamp:chienLoupPlayer?.team,
      // Enfant Sauvage
      enfantSauvageId:esPlayer?.id,
      enfantSauvageModelId:esPlayer?.model,
      // Ange Déchu
      angeDechuId:angeDechuPlayer?.id,
      angeDechuTargetId:angeDechuPlayer?.angelTarget,
      // Nouveaux rôles
      deadIds:out.dead,
      puppetId:out.puppet,
      singeOut:!!na.singeOut,
      singeTargets:(na.singeTargets||[]).map(t=>({id:t.id,wolf:t.wolf})),
      singeDied:out.singeDied,
      mereTargetId:na.mereTarget,
      mereEffective:hasVillagePower(players.find(p=>p.id===na.mereTarget)),
      colosseKillId:out.colosseKill,
      loverDeaths:out.loverDeaths,
      divorceLoserId:out.divorceLoser,
      divorceWinnerId:out.divorcedIds.find(id=>id!==out.divorceLoser)||null,
    });
    // Mémoriser la cible du Salvateur pour la nuit suivante
    setLastSalvateurTarget(na.salvateurTarget||null);
    setNaState(mkNA());
    // Fermer les deux modals sans changer d'écran
    setShowNight(false);
    setShowEveryNight(false);
  };

  const assignRole=(pid,rk)=>setPlayers(prev=>prev.map(p=>p.id===pid?{...p,role:rk,team:ROLES[rk]?.team||null}:p));

  const openReset=()=>{
    setResetKeep(players.map(p=>({id:p.id,name:p.name,keep:true})));
    setShowReset(true);
  };
  const confirmReset=()=>{
    clearSave();
    const kept=resetKeep.filter(p=>p.keep);
    setPlayers(kept.map((p,i)=>({...mkP(i+1),name:p.name})));
    setCount(kept.length);
    setActiveRoles({});
    setNightCount(1);
    setNaState(mkNA());
    setVoleurChosenRole(null);
    setLastSalvateurTarget(null);
    setLastNight(null);
    setVariants({});
    setShowReset(false);
    setScreen('roles');
  };

  /* ── ÉCRAN 1 : COUNT ── */
  if(screen==='count') return(
    <div className="cs">
      <div className="ph">
        <BrandLogo/>
      </div>
      <div className="orn">&#10022;</div>
      <div className="cs-card">
        <div className="thm-l">Ambiance</div>
        <div className="thm">
          <button className={`thm-o${theme==='nuit'?' on':''}`} onClick={()=>setTheme('nuit')}><span className="thm-s nuit"/>Nuit étoilée</button>
          <button className={`thm-o${theme==='gold'?' on':''}`} onClick={()=>setTheme('gold')}><span className="thm-s gold"/>Noir &amp; or</button>
        </div>
        <div style={{fontFamily:"inherit",fontSize:'13px',letterSpacing:'.24em',textTransform:'uppercase',color:'var(--gold-bright)',textAlign:'center',marginBottom:'22px'}}>Combien de joueurs&nbsp;?</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'14px',marginBottom:'24px'}}>
          <button className="stepbtn" disabled={count<=5} onClick={()=>setCount(n=>Math.max(5,n-1))}>&minus;</button>
          <div className="cn-num">{count}</div>
          <button className="stepbtn" disabled={count>=24} onClick={()=>setCount(n=>Math.min(24,n+1))}>+</button>
        </div>
        <div style={{display:'flex',gap:'6px',justifyContent:'center',flexWrap:'wrap',marginBottom:'28px'}}>
          {[8,10,12,15,18].map(n=>(
            <button key={n} className={`preset${count===n?' on':''}`} onClick={()=>setCount(n)}>{n}</button>
          ))}
        </div>
        <button className="btn-p" onClick={()=>setScreen('roles')}>Choisir les r&ocirc;les &rarr;</button>
      </div>
      <p style={{fontFamily:"inherit",fontSize:'13px',letterSpacing:'.25em',color:'rgba(var(--ink-rgb),.45)',marginTop:'30px',textTransform:'uppercase',textAlign:'center'}}>Play Thau'Gether</p>
    </div>
  );

  // Réordonner les joueurs (drag & drop)
  const reorderPlayers=(fromIdx,toIdx)=>{
    if(fromIdx===toIdx) return;
    setPlayers(prev=>{
      const arr=[...prev];
      const [moved]=arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      // Réassigner les IDs pour garder l'ordre visuel
      return arr.map((p,i)=>({...p,id:i+1}));
    });
  };

  /* ── ÉCRAN 2 : RÔLES ── */
  const incRole=rk=>{
    const w=roleWeight(rk);
    setActiveRoles(prev=>{
      const bonus=(prev['VOLEUR']||0)*2;
      const tot=Object.entries(prev).reduce((s,[k,v])=>s+v*roleWeight(k),0);
      if(tot+w>count+bonus) return prev;
      return {...prev,[rk]:(prev[rk]||0)+1};
    });
  };
  const decRole=rk=>{
    setActiveRoles(prev=>{
      const cur=prev[rk]||0; if(cur===0) return prev;
      const next=cur-1;
      if(next===0){const{[rk]:_,...rest}=prev;return rest;}
      return {...prev,[rk]:next};
    });
  };

  if(screen==='roles') return(
    <div className="rs" onClick={()=>setTooltip(null)}>
      <div className="ph">
        <BrandLogo/>
        <p style={{fontSize:'14px',letterSpacing:'.24em',color:'rgba(var(--ink-rgb),.70)',textTransform:'uppercase'}}>S&eacute;lection des r&ocirc;les</p>
      </div>
      <div className="orn">&#10022;</div>

      <div className="rs-grid">

        <div className="rcol">
          <div className="rcol-hdr">
            <span className="rcol-t">Joueurs</span>
            <span style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <span style={{fontFamily:"inherit",fontSize:'14px',color:'rgba(var(--acc-rgb),.50)'}}>{players.length}</span>
              <button className="pfold" onClick={e=>{e.stopPropagation();setPlayersFolded(f=>!f);}} aria-label="Replier la liste">{playersFolded?'\u25be':'\u25b4'}</button>
            </span>
          </div>
          <div className={`plist-body${playersFolded?' folded':''}`}>
            {players.map((p,i)=>{
              const unset=/^Joueur \d+$/.test(p.name);
              return(
                <div key={p.id}
                  className={`plist-row${dragIdx===i?' dragging':''}`}
                  draggable="true"
                  onContextMenu={e=>e.preventDefault()}
                  onDragStart={e=>{e.dataTransfer.effectAllowed='move';setDragIdx(i);}}
                  onDragEnd={()=>setDragIdx(null)}
                  onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';}}
                  onDrop={e=>{e.preventDefault();reorderPlayers(dragIdx,i);setDragIdx(null);}}
                >
                  <span className="drag-handle no-select">&#10287;</span>
                  <span className="plist-i">{i+1}</span>
                  <input
                    className={`plist-in${unset?' unset':''}`}
                    value={p.name}
                    onClick={e=>e.stopPropagation()}
                    onChange={e=>setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,name:e.target.value}:x))}
                    onFocus={e=>e.target.select()}
                  />
                </div>
              );
            })}
          </div>
        </div>

        <div className="rcol">
          <div className="rcol-hdr">
            <span className="rcol-t">R&ocirc;les</span>
            <span className={`rcol-n ${rem===0?'ok':'warn'}`}>
              {totalR} <span style={{opacity:.45,fontWeight:'400'}}>/ {count+voleurBonus2}</span>
            </span>
          </div>

          {Object.entries(TEAMS).map(([team,{label,keys}])=>(
            <div key={team} className="team-blk">
              <div className={`team-hdr ${team}`}>{label}</div>
              <div className="rgrid">
                {[...keys].sort((a,b)=>ROLES[a]?.name.localeCompare(ROLES[b]?.name,'fr')).map(rk=>{
                  const r=ROLES[rk];if(!r) return null;
                  const cnt=activeRoles[rk]||0,on=cnt>0;
                  const hv=!!VARIANTS[rk],isV=on&&hasVar(rk,variants);
                  return(
                    <div key={rk}
                      className={`rcard${on?` on on-${r.team}`:''}${hv?' hasv':''}${isV?' isv':''}`}
                      onClick={e=>{e.stopPropagation();if(on) return;if(hv){setVariantAsk(rk);return;}incRole(rk);}}>
                      <button className="rinfo" onClick={e=>{e.stopPropagation();setTooltip(tooltip===rk?null:rk);}} aria-label="Description">&#8505;</button>
                      {hv&&!on&&<span className="rvdot" title="Variante maison disponible">✦</span>}
                      <div className="rcard-body">
                        <div className="rcard-emo">{isV?VARIANTS[rk].emoji:r.emoji}</div>
                        <div className="rcard-nm">{isV&&VARIANTS[rk].rename?VARIANTS[rk].rename:r.name}</div>
                        {on&&hv&&(
                          <button className={`rcard-var${isV?' on':''}`} onClick={e=>{e.stopPropagation();setVariantAsk(rk);}}>
                            {isV?(VARIANTS[rk].rename?'✦ Variante':`✦ ${VARIANTS[rk].label}`):'Version normale'} ▾
                          </button>
                        )}
                      </div>
                      {on&&(
                        <div className="rbar" onClick={e=>e.stopPropagation()}>
                          <button onClick={()=>decRole(rk)} aria-label="Retirer">&minus;</button>
                          <div className="rbar-n">{cnt}</div>
                          <button onClick={()=>incRole(rk)} aria-label="Ajouter">+</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          <div style={{display:'flex',gap:'8px',marginTop:'10px'}}>
            <button className="btn-g" onClick={()=>setScreen('count')}>&larr; Retour</button>
            <button className="btn-p" style={{flex:1}} disabled={rem!==0}
              onClick={()=>setScreen('game')}>
              {rem===0?'\u2694 Commencer la partie \u2694':rem>0?`Encore ${rem} r\u00f4le${rem>1?'s':''}`:`${Math.abs(rem)} r\u00f4le${Math.abs(rem)>1?'s':''} en trop`}
            </button>
          </div>
        </div>
      </div>

      {tooltip&&(
        <div className="ov" style={{zIndex:300,alignItems:'center'}}
          onClick={()=>setTooltip(null)}>
          <div className="pmod" style={{maxWidth:'400px'}}
            onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:'center',marginBottom:'12px'}}>
              <div className="nse" style={{width:'96px',height:'96px',fontSize:'46px',margin:'0 auto 12px'}}>{ROLES[tooltip]?.emoji}</div>
              <div style={{fontSize:'24px',fontWeight:'700',color:'var(--ink)',marginBottom:'4px'}}>{ROLES[tooltip]?.name}</div>
              <div style={{fontFamily:"inherit",fontSize:'12px',letterSpacing:'.2em',textTransform:'uppercase',color:({loups:'var(--blood)',village:'var(--green)',solo:'var(--purple)',variable:'var(--amber)'})[ROLES[tooltip]?.team]||'var(--ink)'}}>{({loups:'\u2694 Loups',village:'\ud83c\udf3f Village',solo:'\u2b50 Solo',variable:'\ud83c\udf00 Variable'})[ROLES[tooltip]?.team]}</div>
            </div>
            <div style={{width:'100%',height:'1px',background:'linear-gradient(to right,transparent,rgba(255,255,255,.18),transparent)',marginBottom:'12px'}}/>
            <p style={{fontFamily:"inherit",fontSize:'15px',fontStyle:'normal',color:'rgba(var(--ink-rgb),.90)',lineHeight:1.6,textAlign:'center'}}>{ROLES[tooltip]?.desc}</p>
            {VARIANTS[tooltip]&&(
              <div className="vinfo">
                <div className="vinfo-t">✦ Variante maison : {VARIANTS[tooltip].emoji} {VARIANTS[tooltip].label}</div>
                <div className="vinfo-d">{VARIANTS[tooltip].desc}</div>
              </div>
            )}
            <button className="mb cls" style={{marginTop:'16px',width:'100%'}} onClick={()=>setTooltip(null)}>Fermer</button>
          </div>
        </div>
      )}
      {variantAsk&&VARIANTS[variantAsk]&&(()=>{
        const rk=variantAsk,r=ROLES[rk],v=VARIANTS[rk];
        const on=(activeRoles[rk]||0)>0;
        const pick=isVar=>{
          setVariants(prev=>({...prev,[rk]:isVar}));
          if(!on) incRole(rk);
          setVariantAsk(null);
        };
        return(
          <div className="ov" style={{zIndex:310}} onClick={()=>setVariantAsk(null)}>
            <div className="vmod" onClick={e=>e.stopPropagation()}>
              <div className="vmod-t">{r.emoji} {r.name}</div>
              <div className="vmod-s">Quelle version jouez-vous&nbsp;?</div>
              <button className={`vopt${on&&!hasVar(rk,variants)?' sel':''}`} onClick={()=>pick(false)}>
                <span className="vopt-e">{r.emoji}</span>
                <span className="vopt-b">
                  <span className="vopt-n">Version normale</span>
                  <span className="vopt-d">{r.desc}</span>
                </span>
              </button>
              <button className={`vopt v${on&&hasVar(rk,variants)?' sel':''}`} onClick={()=>pick(true)}>
                <span className="vopt-e">{v.emoji}</span>
                <span className="vopt-b">
                  <span className="vopt-n">✦ Variante : {v.label}</span>
                  <span className="vopt-d">{v.desc}</span>
                </span>
              </button>
              <button className="mb cls" style={{width:'100%',marginTop:'4px'}} onClick={()=>setVariantAsk(null)}>Annuler</button>
            </div>
          </div>
        );
      })()}
      <p style={{fontFamily:"inherit",fontSize:'13px',letterSpacing:'.2em',color:'rgba(var(--ink-rgb),.40)',padding:'14px',textTransform:'uppercase',textAlign:'center'}}>Play Thau'Gether</p>
    </div>
  );

  /* ── ÉCRAN 3 : JEU ── */
  const n=players.length,cx=50,cy=50;
  // Géométrie proportionnelle au nombre de joueurs
  const rv = n<=10?38 : n<=14?42 : n<=18?46 : 50;
  const arcSpace = (2*Math.PI*rv)/Math.max(n,1);
  const nodeR = Math.max(4, Math.min(6.6, arcSpace*0.36));
  const nameMax = n<=10?9 : n<=16?7 : 5;
  const nameFS = Math.max(2.4, Math.min(3.3, nodeR*0.5));
  const emojiFS = nodeR*1.12;
  const nameDY = nodeR + nameFS + 1.2;
  const svgHalf = rv + nodeR + 9;
  const viewBox = `${cx-svgHalf} ${cy-svgHalf} ${svgHalf*2} ${svgHalf*2}`;
  // Un rôle n'apparaît dans la bande que si le joueur qui l'a est encore vivant
  const NEEDS_ALIVE=['VOYANTE','CORBEAU','SALVATORE','SORCIERE','RENARD','COMEDIEN',
    'INFECT_PERE','GRAND_MECHANT_LOUP','JOUEUR_FLUTE','LOUP_BLANC','SINGE_SAVANT','PUISSANTE_MERE','COLOSSE'];
  const nightBarItems=EVERY_NIGHT.filter(it=>{
    if(it.role==='LOVER') return activeRoles['CUPIDON']>0 && !!variants.CUPIDON && players.filter(p=>p.alive&&p.lover).length===2;
    if(it.role==='CHARMED') return activeRoles['JOUEUR_FLUTE']>0 && players.some(p=>p.alive&&p.enchanted);
    if(it.role==='LOUP') return players.some(p=>p.alive&&isWolf(p));
    if(it.role==='PUISSANTE_MERE'&&nightCount>2) return false;
    // Rôles avec joueur : seulement si ce joueur est vivant
    if(NEEDS_ALIVE.includes(it.role)) return activeRoles[it.role]>0 && players.some(p=>p.alive&&p.role===it.role);
    return activeRoles[it.role]>0;
  });
  const bear=players.find(p=>p.role==='MONTREUR_OURS'&&p.alive);
  const availRoles=Object.keys(activeRoles);

  const lastNightVictim=lastNight?.wolfVictimId?players.find(p=>p.id===lastNight.wolfVictimId):null;
  const lastNightPoisoned=lastNight?.potionDeathId?players.find(p=>p.id===lastNight.potionDeathId):null;
  const lastNightCorbeau=lastNight?.corbeauId?players.find(p=>p.id===lastNight.corbeauId):null;
  const lastNightLB=lastNight?.loupBlancId?players.find(p=>p.id===lastNight.loupBlancId):null;

  return(
    <div className="gs">
      {/* ── EN-TÊTE JEU ── */}
      <div className="gtop">
        <div className="gbrand">
          <div><div className="gbrand-t">Le Village s'endort</div><div className="gbrand-s">Play Thau'Gether</div></div>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button className="ibtn" title="Réorganiser les joueurs" aria-label="Réorganiser les joueurs" onClick={()=>setShowReorder(true)}><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
          <button className="ibtn" title="Nouvelle partie" aria-label="Nouvelle partie" onClick={openReset}><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        </div>
      </div>
      <div className="gstats">
        <span className="gstat w"><i/>{stats.wolves} loup{stats.wolves>1?'s':''}</span>
        <span className="gstat v"><i/>{stats.village} villageois</span>
        {players.some(p=>!p.alive)&&<span className="gstat d"><i/>{players.filter(p=>!p.alive).length} mort{players.filter(p=>!p.alive).length>1?'s':''}</span>}
      </div>

      {/* ── BANDEAU OURS — au-dessus de la table ── */}
      {bear&&bear.bearGrowl&&(
        <div className="bear growl">
          <span className="bear-e">🐻</span>
          <div><div className="bear-t">L'ours grogne&nbsp;!</div><div className="bear-s">Un voisin de {bear.name} est un loup</div></div>
        </div>
      )}
      {bear&&!bear.bearGrowl&&(
        <div className="bear calm"><span className="bear-e">🐻</span><span className="bear-s">L'ours de {bear.name} est calme</span></div>
      )}

      {/* ── CERCLE TABLE ── */}
      <div style={{display:'flex',justifyContent:'center'}}>
        <div className="board" style={{margin:0,width:'min(100vw, 100vh - 200px)',maxWidth:'680px'}}>
        <svg ref={svgRef} viewBox={viewBox} className="csvg">
          <defs>
            <radialGradient id="tbg" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="#ffffff" stopOpacity=".06"/><stop offset="100%" stopColor="#ffffff" stopOpacity="0"/></radialGradient>
            <radialGradient id="moon" cx="38%" cy="34%" r="70%"><stop offset="0%" style={{stopColor:'var(--moon1)'}}/><stop offset="55%" style={{stopColor:'var(--moon2)'}}/><stop offset="100%" style={{stopColor:'var(--moon3)'}}/></radialGradient>
            <radialGradient id="mglow" cx="50%" cy="50%" r="50%"><stop offset="40%" style={{stopColor:'var(--mglow1)',stopOpacity:.55}}/><stop offset="100%" style={{stopColor:'var(--mglow2)',stopOpacity:0}}/></radialGradient>
            <linearGradient id="ndg" x1="0" y1="0" x2=".6" y2="1"><stop offset="0%" stopColor="#ffffff" stopOpacity=".22"/><stop offset="100%" stopColor="#ffffff" stopOpacity=".04"/></linearGradient>
          </defs>
          <circle cx={cx} cy={cy} r={rv} fill="url(#tbg)" stroke="rgba(255,255,255,.09)" strokeWidth=".3"/>
          <circle cx={cx} cy={cy} r={rv*.62} fill="url(#mglow)"/>
          <circle cx={cx} cy={cy} r={rv*.34} fill="url(#moon)"/>
          <text x={cx} y={cy-rv*.1} textAnchor="middle" style={{fontSize:`${rv*.075}px`,fill:'var(--moon-t1)',fontWeight:600,letterSpacing:'.3em'}}>NUIT</text>
          <text x={cx} y={cy+rv*.2} textAnchor="middle" style={{fontSize:`${rv*.3}px`,fill:'var(--moon-t2)',fontWeight:700}}>{nightCount}</text>
          {players.filter(p=>p.lover&&p.loverId&&p.id<p.loverId).map(p=>{
            const pi=players.findIndex(x=>x.id===p.id),li=players.findIndex(x=>x.id===p.loverId);
            const a1=(360/n)*pi-90,a2=(360/n)*li-90;
            const x1=cx+rv*Math.cos(a1*Math.PI/180),y1=cy+rv*Math.sin(a1*Math.PI/180);
            const x2=cx+rv*Math.cos(a2*Math.PI/180),y2=cy+rv*Math.sin(a2*Math.PI/180);
            return <line key={p.id} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#ff8fd0" strokeWidth=".45" strokeDasharray="1.2,1.2" strokeLinecap="round" opacity=".85"/>;
          })}
          {/* Ligne pointillée verte : Enfant Sauvage → son modèle */}
          {players.filter(p=>p.role==='ENFANT_SAUVAGE'&&p.model&&p.alive).map(p=>{
            const es=players.find(x=>x.id===p.id), mo=players.find(x=>x.id===p.model);
            if(!mo) return null;
            const pi=players.findIndex(x=>x.id===es.id),mi=players.findIndex(x=>x.id===mo.id);
            const a1=(360/n)*pi-90,a2=(360/n)*mi-90;
            const x1=cx+rv*Math.cos(a1*Math.PI/180),y1=cy+rv*Math.sin(a1*Math.PI/180);
            const x2=cx+rv*Math.cos(a2*Math.PI/180),y2=cy+rv*Math.sin(a2*Math.PI/180);
            return <g key={`es-${p.id}`}>
              <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#5eeaa9" strokeWidth=".45" strokeDasharray="1.2,1.2" strokeLinecap="round" opacity=".8"/>
              <text x={(x1+x2)/2} y={(y1+y2)/2-1} textAnchor="middle" style={{fontSize:'3px'}}>🧒</text>
            </g>;
          })}
          {players.map((p,i)=>{
            const angle=(360/n)*i-90,rad=angle*Math.PI/180;
            const px=cx+rv*Math.cos(rad),py=cy+rv*Math.sin(rad);
            const dead=!p.alive,wolf=isWolf(p),role=p.role?{...ROLES[p.role],emoji:roleEmoji(p.role,variants)}:null;
            const tcol=wolf?'#ff6b81':role?.team==='village'?'#5eeaa9':role?.team==='solo'?'#c4b5ff':role?.team==='variable'?'#ffc46b':'var(--accent)';
            const label=p.name.length>nameMax?p.name.slice(0,nameMax-1)+'…':p.name;
            const pillW=label.length*nameFS*.56+nameFS*1.5, pillH=nameFS*1.75;
            return(
              <g key={p.id} className="pnode"
                transform={`translate(${px},${py})`}
                onClick={()=>setSelId(selId===p.id?null:p.id)}
                style={{cursor:'pointer'}} opacity={dead?.4:1}>
                {p.bearGrowl&&p.alive&&(<>
                  <circle r={nodeR+2.2} fill="none" stroke="#ff6b81" strokeWidth={nodeR*.18}/>
                  <circle r={nodeR+2} fill="none" stroke="#ff6b81" strokeWidth={nodeR*.16}>
                    <animate attributeName="r" values={`${nodeR+2};${nodeR+6};${nodeR+2}`} dur="1.2s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values=".8;0;.8" dur="1.2s" repeatCount="indefinite"/>
                  </circle>
                  <text textAnchor="middle" y={-(nodeR+3.6)} style={{fontSize:`${nameFS*1.1}px`,fill:'#ff9aaa',fontWeight:700}}>🐻!</text>
                </>)}
                {!dead&&<circle r={nodeR*1.25} fill={tcol} opacity={wolf?.2:.1}/>}
                <circle r={nodeR} fill="rgba(var(--deep-rgb),.92)"/>
                <circle r={nodeR} fill="url(#ndg)" stroke={dead?'rgba(var(--ink-rgb),.35)':tcol} strokeWidth={nodeR*.085} strokeOpacity={wolf?1:.75}/>
                <text textAnchor="middle" y="0" dominantBaseline="central" style={{fontSize:`${emojiFS*.92}px`}}>{role?.emoji||'❓'}</text>
                <rect x={-pillW/2} y={nameDY-nameFS*1.18} width={pillW} height={pillH} rx={pillH/2} fill="rgba(var(--deep-rgb),.86)" stroke="rgba(255,255,255,.12)" strokeWidth=".15"/>
                <text textAnchor="middle" y={nameDY-nameFS*.05} style={{fontSize:`${nameFS}px`,fill:'var(--ink)',fontWeight:600,textDecoration:dead?'line-through':'none'}}>{label}</text>
                {!dead&&(p.mute||p.powerless)&&(
                  <text x={nodeR*.8} y={-nodeR*.7} textAnchor="middle" dominantBaseline="central" style={{fontSize:`${nameFS*1.1}px`}}>{p.powerless?'⛔':'🤐'}</text>
                )}
                {dead&&<text x={nodeR*.8} y={-nodeR*.7} textAnchor="middle" dominantBaseline="central" style={{fontSize:`${nameFS*1.1}px`}}>💀</text>}
              </g>
            );
          })}
        </svg>
        </div>
      </div>

      {/* ══ PANNEAU BAS — HORIZONTAL ══ */}
      <div style={{width:'100%',marginTop:'4px',display:'flex',flexDirection:'column',gap:'14px'}}>

        {/* Boutons : l'action attendue est mise en avant */}
        <div className="gbtns">
          <button className={`gbtn${nightCount<=1?' pri':''}`} onClick={()=>{setNightIdx(0);setShowNight(true);}}>{nightCount<=1?'Lancer la 1ère nuit →':'1ère nuit'}</button>
          <button className={`gbtn${nightCount>1?' pri':''}`} onClick={()=>{setEveryNightIdx(0);setShowEveryNight(true);}}>{nightCount>1?`Lancer la nuit ${nightCount} →`:'Nuit suivante'}</button>
        </div>
        {/* Récap + Ordre de nuit côte à côte */}
        <div className="gpanels">

          {lastNight&&(
            <div className="gcard" style={{flex:2,maxHeight:'320px',overflowY:'auto'}}>
              <div className="gcard-h">
                <div className="gcard-t">Résumé · Nuit {lastNight.nightNumber}</div>
                {(()=>{
                  const nd=[];
                  if(Array.isArray(lastNight.deadIds)) nd.push(...lastNight.deadIds);
                  else {
                    // Ancien format de sauvegarde
                    if(lastNight.wolfVictimId&&!lastNight.wolfVictimSaved&&!lastNight.infectTransformed) nd.push(lastNight.wolfVictimId);
                    if(lastNight.gmgVictimId) nd.push(lastNight.gmgVictimId);
                    if(lastNight.potionDeathId) nd.push(lastNight.potionDeathId);
                    if(lastNight.loupBlancId) nd.push(lastNight.loupBlancId);
                  }
                  const unique=[...new Set(nd)];
                  return <div className={`gpill ${unique.length===0?'ok':'bad'}`}>{unique.length===0?'Aucun mort':`${unique.length} mort${unique.length>1?'s':''}`}</div>;
                })()}
              </div>
              {(()=>{
                // Libellé : l'emoji de tête devient une icône carrée
                const S=({children})=>{const t=typeof children==='string'?children:'';const k=t.indexOf(' ');return k>0?<><span className="gev-i">{t.slice(0,k)}</span><div className="gev-l">{t.slice(k+1)}</div></>:<div className="gev-l">{children}</div>;};
                const V=({children,bold})=><div className={`gev-v${bold?' b':''}`}>{children}</div>;
                const Bloc=({children})=><div className="gev">{children}</div>;
                const N=(id)=>players.find(p=>p.id===id)?.name||'?';
                const events=[];

                // ── MORTS
                const lnv=lastNight?.wolfVictimId?players.find(p=>p.id===lastNight.wolfVictimId):null;
                if(lnv) events.push(<Bloc key="w"><S>🐺 Dévoré par les loups</S><V bold>{lnv.name} <span style={{fontSize:'13px',opacity:.6}}>({ROLES[lnv.role]?.name})</span></V>{lastNight.puppetId===lnv.id&&<V><span style={{color:'var(--green)',fontSize:'13px'}}>🪆 Sa marionnette meurt à sa place</span></V>}{lastNight.wolfVictimSaved&&<V><span style={{color:'var(--green)',fontSize:'13px'}}>{lastNight.saviorType==='salvateur'?'🛡️ Sauvé par le Salvateur':'🧪 Sauvé par la potion'}</span></V>}</Bloc>);
                else events.push(<Bloc key="nw"><S>🐺 Les loups</S><V>Aucune victime</V></Bloc>);
                if(lastNight.gmgVictimId) events.push(<Bloc key="g"><S>👹 2ème victime (Grand Méchant Loup)</S><V bold>{N(lastNight.gmgVictimId)} <span style={{fontSize:'13px',opacity:.6}}>({ROLES[players.find(p=>p.id===lastNight.gmgVictimId)?.role]?.name})</span></V></Bloc>);
                if(lastNight.infectTransformed) events.push(<Bloc key="inf"><S>🦠 Transformé en loup (Infect Père)</S><V bold>{N(lastNight.infectTransformed)}</V></Bloc>);
                if(lastNight.loupBlancId) events.push(<Bloc key="lb"><S>🤍 Tué par le Loup Blanc</S><V bold>{N(lastNight.loupBlancId)}</V></Bloc>);
                const lnp=lastNight?.potionDeathId?players.find(p=>p.id===lastNight.potionDeathId):null;
                if(lnp) events.push(<Bloc key="pd"><S color="var(--purple)">☠️ Tué par la potion de mort</S><V bold>{lnp.name}</V></Bloc>);

                // ── SAUVETAGES / PROTECTION
                if(lastNight.potionLifeUsed&&lastNight.potionLifeTargetId) events.push(<Bloc key="pv"><S color="var(--green)">🧪 Potion de vie utilisée</S><V bold>{N(lastNight.potionLifeTargetId)} — survit</V></Bloc>);
                if(lastNight.salvateurId) events.push(<Bloc key="salv"><S color="var(--green)">🛡️ Protégé par le Salvateur</S><V bold>{N(lastNight.salvateurId)}</V></Bloc>);

                // ── CORBEAU
                if(lastNight.corbeauId) events.push(<Bloc key="corb"><S color="rgba(var(--ink-rgb),1)">🦅 Curseur Corbeau (+2 votes)</S><V bold>{N(lastNight.corbeauId)}</V></Bloc>);

                // ── VOYANTE
                if(lastNight.voyanteTargetId) events.push(<Bloc key="voy"><S color="rgba(196,181,255,1)">🔮 Voyante a inspecté</S><V bold>{N(lastNight.voyanteTargetId)}</V><V><span style={{color:lastNight.voyanteTargetIsWolf?'var(--blood)':'var(--green)',fontSize:'13px'}}>{lastNight.voyanteTargetIsWolf?"🐺 C'est un loup !":'✅ Pas un loup'}</span></V></Bloc>);

                // ── RENARD
                if(lastNight.renardTargetIds?.length) events.push(<Bloc key="ren"><S color="var(--amber)">🦊 Renard a inspecté</S><V>{lastNight.renardTargetIds.map(id=>N(id)).join(', ')}</V><V><span style={{color:lastNight.renardResult?'var(--blood)':'var(--green)',fontSize:'13px'}}>{lastNight.renardResult?"🐺 Loup détecté !":'Aucun loup'}{lastNight.renardLostPower?' — pouvoir perdu':''}</span></V></Bloc>);

                // ── FLÛTE
                if(lastNight.newEnchantedIds?.length) events.push(<Bloc key="flute"><S color="var(--purple)">🎵 Nouveaux enchantés (Flûte)</S><V bold>{lastNight.newEnchantedIds.map(id=>N(id)).join(' & ')}</V>{lastNight.enchantedIds?.length>lastNight.newEnchantedIds?.length&&<V><span style={{fontSize:'13px',opacity:.6}}>Total : {lastNight.enchantedIds.map(id=>N(id)).join(', ')}</span></V>}</Bloc>);

                // ── NOUVEAUX RÔLES
                if(lastNight.colosseKillId) events.push(<Bloc key="col"><S>💪 Riposte du Colosse</S><V bold>{N(lastNight.colosseKillId)} <span style={{fontSize:'13px',opacity:.6}}>(emporté)</span></V></Bloc>);
                if(lastNight.singeOut) events.push(<Bloc key="singe"><S color="var(--amber)">🐒 Singe Savant est sorti</S><V>{(lastNight.singeTargets||[]).map(t=>N(t.id)).join(', ')||'—'}</V><V><span style={{color:lastNight.singeDied?'var(--blood)':'var(--green)',fontSize:'13px'}}>{lastNight.singeDied?'🐺 A découvert un Loup — mort':'Que des Villageois'}</span></V></Bloc>);
                if(lastNight.mereTargetId) events.push(<Bloc key="mere"><S>👑 Mère des Loups a ciblé</S><V bold>{N(lastNight.mereTargetId)}</V><V><span style={{fontSize:'13px',color:lastNight.mereEffective?'var(--blood)':'rgba(var(--ink-rgb),.62)'}}>{lastNight.mereEffective?'Pouvoir supprimé':'Aucun effet'}</span></V></Bloc>);
                if(lastNight.divorceLoserId) events.push(<Bloc key="div"><S color="#ff8fd0">💔 Divorce des amoureux</S><V bold>{N(lastNight.divorceLoserId)} — perd au chifoumi et meurt</V>{lastNight.divorceWinnerId&&<V><span style={{fontSize:'13px',opacity:.65}}>{N(lastNight.divorceWinnerId)} n'est plus amoureux{(lastNight.deadIds||[]).includes(lastNight.divorceWinnerId)?'':' et survit'}</span></V>}</Bloc>);
                if(lastNight.loverDeaths?.length) events.push(<Bloc key="chag"><S color="#ff8fd0">💔 Mort de chagrin</S><V bold>{lastNight.loverDeaths.map(id=>N(id)).join(', ')}</V></Bloc>);

                // ── 1ÈRE NUIT SPÉCIALE
                if(lastNight.isFirstNight){
                  if(lastNight.loversIds?.length===2) events.push(<Bloc key="cup"><S color="#ff8fd0">💘 Amoureux (Cupidon)</S><V bold>{lastNight.loversIds.map(id=>N(id)).join(' & ')}</V></Bloc>);
                  if(lastNight.chienLoupId) events.push(<Bloc key="cl"><S color="var(--amber)">🐕 Chien-Loup a choisi</S><V bold><span style={{color:lastNight.chienLoupCamp==='loups'?'var(--blood)':'var(--green)'}}>{lastNight.chienLoupCamp==='loups'?'🐺 Camp des Loups':'🌿 Camp Village'}</span></V></Bloc>);
                  if(lastNight.enfantSauvageId&&lastNight.enfantSauvageModelId) events.push(<Bloc key="es"><S color="var(--green)">🧒 Modèle Enfant Sauvage</S><V bold>{N(lastNight.enfantSauvageModelId)}</V></Bloc>);
                  if(lastNight.voleurId&&lastNight.voleurChosenRole) events.push(<Bloc key="vol"><S color="var(--amber)">🃏 Voleur a pris le rôle</S><V bold>{ROLES[lastNight.voleurChosenRole]?.emoji} {ROLES[lastNight.voleurChosenRole]?.name}</V></Bloc>);
                }

                return <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:'0 18px',alignItems:'start'}}>{events}</div>;
              })()}
            </div>
          )}

          {/* Ordre de nuit */}
          <div className="gcard gorder">
            <div className="gorder-t">Ordre de nuit</div>
            {nightBarItems.map((it,i)=>(
              <div key={i} className="gorder-i">
                <span className="gorder-n">{i+1}</span>
                <span style={{fontSize:'17px'}}>{it.emoji||ROLES[it.role]?.emoji||'✦'}</span>
                <span className="gorder-l">{it.name}</span>
              </div>
            ))}
          </div>

        </div>{/* fin flex récap+ordre */}
      </div>{/* fin panneau bas */}

      {/* Modal joueur */}
      {selId&&(()=>{
        const p=players.find(x=>x.id===selId);if(!p) return null;
        const role=p.role?{...ROLES[p.role],name:roleName(p.role,variants),emoji:roleEmoji(p.role,variants),desc:roleDesc(p.role,variants)}:null;
        const isTireur=p.role==='CHASSEUR'&&hasVar('CHASSEUR',variants);
        const closeMod=()=>{setSelId(null);setServanteAsk(null);setShotTarget('');};
        return(
          <div className="ov" onClick={closeMod}>
            <div className="pmod" onClick={e=>e.stopPropagation()}>
              <div className="mod-name">{p.name}</div>
              <div className="mod-rl">
                <span style={{fontSize:'20px'}}>{role?.emoji||'❓'}</span>
                <span>{role?.name||'Sans rôle'}</span>
                {p.role&&hasVar(p.role,variants)&&<span className="vtag">✦ Variante</span>}
                {p.alive?<span className="gpill ok" style={{marginLeft:'auto'}}>Vivant</span>:<span className="gpill bad" style={{marginLeft:'auto'}}>Mort</span>}
              </div>
              {role?.desc&&<p className="mod-desc">{role.desc}</p>}
              {/* Infos supplémentaires joueur */}
              {p.lover&&<div className="minfo" style={{color:'#ff8fd0'}}>💘 Amoureux de {players.find(x=>x.id===p.loverId)?.name||'?'}{hasVar('CUPIDON',variants)?' — se réveillent chaque nuit, divorce possible':''}</div>}
              {p.role==='ENFANT_SAUVAGE'&&p.model&&<div className="minfo" style={{color:'var(--green)'}}>🌿 Modèle : {players.find(x=>x.id===p.model)?.name||'?'}</div>}
              {p.enchanted&&<div className="minfo" style={{color:'var(--purple)'}}>🎵 Joueur charmé</div>}
              {isWolf(p)&&<div className="minfo" style={{color:'var(--blood)'}}>🐺 Camp des Loups</div>}
              {p.mute&&<div className="minfo" style={{color:'var(--amber)'}}>🪆 Marionnette utilisée — ne peut plus parler, seulement voter</div>}
              {p.powerless&&<div className="minfo" style={{color:'var(--blood)'}}>👑 Pouvoir supprimé par la Mère des Loups</div>}
              {p.role==='SINGE_SAVANT'&&p.singeUsed&&<div className="minfo" style={{color:'rgba(var(--ink-rgb),.69)'}}>🐒 Pouvoir déjà utilisé</div>}
              {/* TIREUR D'ÉLITE : tir de jour */}
              {isTireur&&p.alive&&(
                p.shotUsed?<div className="shot used">🎯 Tir déjà utilisé</div>
                :p.powerless?<div className="shot used">🎯 Pouvoir supprimé : il ne peut plus tirer</div>
                :(
                  <div className="shot">
                    <div className="shot-t">🎯 Tirer pendant le débat</div>
                    <div className="shot-s">Loup abattu : le Tireur reste en vie. Sinon il meurt avec sa cible.</div>
                    <div style={{display:'flex',gap:'8px',marginTop:'8px'}}>
                      <select value={shotTarget} onChange={e=>setShotTarget(e.target.value)} className="shot-sel">
                        <option value="">— Cible —</option>
                        {players.filter(x=>x.alive&&x.id!==p.id).map(x=><option key={x.id} value={x.id}>{x.name}{x.role?` (${roleName(x.role,variants)})`:''}</option>)}
                      </select>
                      <button className="mb kill" style={{padding:'10px 14px'}} disabled={!shotTarget} onClick={()=>tireurShoot(p.id,parseInt(shotTarget))}>Tirer</button>
                    </div>
                  </div>
                )
              )}
              {/* Changer le rôle */}
              <div style={{marginTop:'12px',borderTop:'1px solid rgba(255,255,255,.09)',paddingTop:'12px'}}>
                <div className="mlbl">Changer le rôle</div>
                <select
                  value={p.role||''}
                  onChange={e=>{
                    const rk=e.target.value;
                    if(!rk) return;
                    setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,role:rk,team:ROLES[rk]?.team||x.team,isInfected:false}:x));
                  }}
                  className="msel">
                  <option value="">— Sélectionner un rôle —</option>
                  {Object.keys(activeRoles).filter(rk=>activeRoles[rk]>0).sort((a,b)=>ROLES[a]?.name.localeCompare(ROLES[b]?.name,'fr')).map(rk=>(
                    <option key={rk} value={rk}>{roleEmoji(rk,variants)} {roleName(rk,variants)}{p.role===rk?' ✓':''}</option>
                  ))}
                </select>
              </div>
              {servanteAsk===p.id&&(()=>{
                const serv=players.find(x=>x.role==='SERVANTE'&&x.alive&&x.id!==p.id);
                if(!serv) return null;
                return(
                  <div className="servq">
                    <div className="servq-t">🧹 La Servante Dévouée prend-elle la place de {p.name}&nbsp;?</div>
                    <div className="servq-s">Seulement en cas d'élimination par le vote du village. Servante : {serv.name}</div>
                    <div style={{display:'flex',gap:'8px',marginTop:'10px'}}>
                      <button className="mb cls" style={{flex:1}} onClick={()=>{toggleAlive(p.id);setServanteAsk(null);setSelId(null);}}>Non, {p.name} meurt</button>
                      <button className="mb rev" style={{flex:1}} onClick={()=>{servanteTakes(p.id);setServanteAsk(null);setSelId(null);}}>Oui, elle prend son rôle</button>
                    </div>
                  </div>
                );
              })()}
              <div className="mod-btns" style={{marginTop:'8px'}}>
                {p.alive?(servanteAsk===p.id?null:<button className="mb kill" onClick={()=>{
                  const serv=players.find(x=>x.role==='SERVANTE'&&x.alive&&x.id!==p.id&&!x.powerless);
                  if(serv){setServanteAsk(p.id);return;}
                  toggleAlive(p.id);setSelId(null);
                }}>🗡️ Tuer le joueur</button>):<button className="mb rev" onClick={()=>{toggleAlive(p.id);setSelId(null);}}>↩ Ressusciter</button>}
                {/* Transformer en loup — visible si le joueur est vivant et pas déjà loup */}
                {p.alive&&!isWolf(p)&&(
                  <button className="mb kill" style={{background:'linear-gradient(135deg,rgba(255,107,129,.18),rgba(80,5,5,.25))',borderColor:'rgba(255,107,129,.45)',color:'var(--blood)'}}
                    onClick={()=>{
                      setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,isInfected:true,team:'loups'}:x));
                      setSelId(null);
                    }}>
                    🐺 Transformer en Loup-Garou
                  </button>
                )}
                {p.alive&&isWolf(p)&&(
                  <button className="mb cls" style={{borderColor:'rgba(94,234,169,.32)',color:'var(--green)'}}
                    onClick={()=>{
                      setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,isInfected:false,team:ROLES[x.role]?.team||'village'}:x));
                      setSelId(null);
                    }}>
                    🌿 Retirer du camp Loups
                  </button>
                )}
                <button className="mb cls" onClick={closeMod}>Fermer</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Résultat du tir du Tireur d'élite */}
      {shotResult&&(()=>{
        const N=id=>players.find(x=>x.id===id)?.name||'?';
        const close=()=>{setShotResult(null);setSelId(null);};
        return(
          <div className="ov" style={{zIndex:320}} onClick={close}>
            <div className="pmod" style={{textAlign:'center'}} onClick={e=>e.stopPropagation()}>
              <div style={{fontSize:'44px'}}>{shotResult.wolf?'🐺':'💀'}</div>
              <div className="mod-name" style={{marginTop:'4px'}}>{N(shotResult.targetId)} est abattu</div>
              <div className={`shotres ${shotResult.wolf?'g':'r'}`}>
                {shotResult.wolf
                  ?<>C'était un Loup&nbsp;! {N(shotResult.shooterId)} reste en vie (plus de tir).</>
                  :<>Ce n'était pas un Loup&nbsp;: {N(shotResult.shooterId)} meurt avec lui.</>}
              </div>
              {shotResult.chain.length>0&&<div className="shotres p">💔 Mort de chagrin : {shotResult.chain.map(N).join(', ')}</div>}
              <button className="mb cls" style={{width:'100%',marginTop:'12px'}} onClick={close}>OK</button>
            </div>
          </div>
        );
      })()}

      {/* ── MODALE RESET ── */}
      {/* ── MODAL RÉORGANISATION ── */}
      {showReorder&&(
        <div className="ov" onClick={()=>setShowReorder(false)}>
          <div className="pmod" style={{maxWidth:'420px',maxHeight:'82vh'}}
            onClick={e=>e.stopPropagation()}>
            <div className="mod-name" style={{textAlign:'center'}}>Réorganiser les joueurs</div>
            <p style={{fontFamily:"inherit",fontSize:'14px',fontStyle:'normal',color:'rgba(var(--ink-rgb),.62)',textAlign:'center',marginBottom:'14px'}}>Glissez les joueurs pour changer leur place à la table</p>
            <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
              {players.map((p,i)=>(
                <div key={p.id}
                  className={`player-row${dragIdx===i?' dragging':''}`}
                  draggable="true"
                  onContextMenu={e=>e.preventDefault()}
                  onDragStart={e=>{e.dataTransfer.effectAllowed='move';setDragIdx(i);}}
                  onDragEnd={()=>setDragIdx(null)}
                  onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';}}
                  onDrop={e=>{e.preventDefault();reorderPlayers(dragIdx,i);setDragIdx(null);}}
                  style={{background:dragIdx===i?'rgba(var(--acc-rgb),.10)':'transparent',borderRadius:'16px',transition:'background .15s'}}
                >
                  <span className="drag-handle no-select" style={{fontSize:'16px'}}>⠿</span>
                  <span className="plist-i">{i+1}</span>
                  <span style={{fontFamily:"inherit",fontSize:'16px',color:'var(--ink)',flex:1}}>{p.name}</span>
                  {p.role&&<span style={{fontSize:'18px'}}>{ROLES[p.role]?.emoji}</span>}
                  <span className={`gpill ${p.alive?'ok':'bad'}`}>{p.alive?'vivant':'mort'}</span>
                </div>
              ))}
            </div>
            <button className="btn-p" style={{marginTop:'16px'}} onClick={()=>setShowReorder(false)}>Confirmer</button>
          </div>
        </div>
      )}

      {showReset&&(
        <div className="ov" onClick={()=>setShowReset(false)}>
          <div className="pmod" style={{maxWidth:'460px',maxHeight:'80vh',overflow:'hidden',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
              <div className="mod-name" style={{margin:0}}>Nouvelle partie</div>
              <button onClick={()=>setShowReset(false)} style={{background:'none',border:'none',color:'rgba(var(--ink-rgb),.50)',fontSize:'20px',cursor:'pointer'}}>✕</button>
            </div>
            <p style={{fontFamily:"inherit",fontSize:'14px',fontStyle:'normal',color:'rgba(var(--ink-rgb),.62)',marginBottom:'12px',lineHeight:1.4}}>
              Qui joue la prochaine partie ? Clique pour retirer un joueur.
            </p>
            <div style={{overflowY:'auto',flex:1,marginBottom:'12px',display:'flex',flexDirection:'column',gap:'6px'}}>
              {resetKeep.map(p=>(
                <div key={p.id}
                  style={{display:'flex',alignItems:'center',gap:'8px',padding:'12px 14px',borderRadius:'14px',border:`1px solid ${p.keep?'rgba(94,234,169,.32)':'rgba(255,107,129,.27)'}`,background:p.keep?'rgba(94,234,169,.06)':'rgba(255,107,129,.05)',cursor:'pointer',transition:'all .15s'}}
                  onClick={()=>setResetKeep(prev=>prev.map(x=>x.id===p.id?{...x,keep:!x.keep}:x))}>
                  <span style={{fontSize:'16px'}}>{p.keep?'✓':'✗'}</span>
                  <span style={{fontFamily:"inherit",fontSize:'15px',color:p.keep?'var(--ink)':'rgba(var(--ink-rgb),.47)',flex:1,textDecoration:p.keep?'none':'line-through'}}>{p.name}</span>
                  <span style={{fontFamily:"inherit",fontSize:'12px',letterSpacing:'.1em',color:p.keep?'var(--green)':'var(--blood)'}}>{p.keep?'JOUE':'PART'}</span>
                </div>
              ))}
              {/* Ajouter un joueur */}
              <button
                style={{padding:'12px',background:'transparent',border:'1px dashed rgba(var(--ink-rgb),.28)',borderRadius:'14px',fontSize:'15px',fontWeight:600,color:'var(--muted)',cursor:'pointer'}}
                onClick={()=>setResetKeep(prev=>[...prev,{id:Date.now(),name:`Joueur ${prev.length+1}`,keep:true}])}>
                + Ajouter un joueur
              </button>
            </div>
            <div style={{display:'flex',gap:'8px'}}>
              <button className="btn-g" style={{flex:1}} onClick={()=>setShowReset(false)}>Annuler</button>
              <button className="btn-p" style={{flex:2}} disabled={resetKeep.filter(p=>p.keep).length<5} onClick={confirmReset}>
                Valider ({resetKeep.filter(p=>p.keep).length} joueurs)
              </button>
            </div>
            {resetKeep.filter(p=>p.keep).length<5&&<p style={{fontFamily:"inherit",fontSize:'13px',fontStyle:'normal',color:'var(--blood)',textAlign:'center',marginTop:'6px'}}>Minimum 5 joueurs requis</p>}
          </div>
        </div>
      )}

      {showNight&&<NightSlide slides={nightSlides} idx={nightIdx} setIdx={setNightIdx} players={players} setPlayers={setPlayers} na={na} setNA={setNA} onClose={()=>setShowNight(false)} onFinish={()=>{applyNight();setNightCount(n=>n+1);}} assignRole={assignRole} title="Première nuit" isFirstNight={true} voleurChosenRole={voleurChosenRole} setVoleurChosenRole={setVoleurChosenRole} activeRoles={activeRoles} setPlayers={setPlayers} lastSalvateurTarget={null} variants={variants}/>}
      {showEveryNight&&<NightSlide slides={everyNightSlides} idx={everyNightIdx} setIdx={setEveryNightIdx} players={players} setPlayers={setPlayers} na={na} setNA={setNA} onClose={()=>setShowEveryNight(false)} onFinish={()=>{applyNight();setNightCount(n=>n+1);setShowEveryNight(false);}} assignRole={assignRole} title={`Nuit ${nightCount}`} isFirstNight={false} activeRoles={activeRoles} lastSalvateurTarget={lastSalvateurTarget} variants={variants}/>}
    </div>
  );
}

// Sélecteur à pastilles : remplace les listes déroulantes de la nuit (mêmes props que <select>)
function ChipSelect({value,onChange,children,style}){
  const opts=[];
  const walk=ch=>React.Children.forEach(ch,c=>{
    if(!c||typeof c!=='object') return;
    if(c.type==='option'){opts.push(c);return;}
    if(c.props&&c.props.children) walk(c.props.children);
  });
  walk(children);
  const txt=ch=>React.Children.toArray(ch).map(x=>typeof x==='string'||typeof x==='number'?String(x):'').join('');
  const cur=value==null?'':String(value);
  const hasEmpty=opts.some(o=>String(o.props.value??'')==='');
  const fire=v=>onChange&&onChange({target:{value:String(v)}});
  return(
    <div className="chs" style={style}>
      {opts.filter(o=>String(o.props.value??'')!=='').map(o=>{
        const v=String(o.props.value),t=txt(o.props.children).trim();
        const m=t.match(/^(.*?)\s*\(([^()]*)\)\s*(✓)?$/);
        const on=cur===v;
        return(
          <button type="button" key={v} className={`chs-o${on?' on':''}`} disabled={!!o.props.disabled}
            onClick={()=>fire(on&&hasEmpty?'':v)}>
            <span>{m?m[1]:t}{m&&<small>{m[2]}</small>}</span>
          </button>
        );
      })}
    </div>
  );
}

                          const r=ROLES[rk]; if(!r) return null;
                          const chosen=voleurChosenRole===rk;
                          const borderC={loups:'var(--blood)',village:'var(--green)',solo:'var(--purple)',variable:'var(--amber)'}[r.team]||'rgba(var(--ink-rgb),.28)';

                            <div key={rk} onClick={()=>{setVoleurChosenRole(rk);setPlayers(prev=>prev.map(p=>p.id===voleurP.id?{...p,role:rk,team:r.team}:p));}}
