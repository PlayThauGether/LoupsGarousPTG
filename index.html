          <button className="stepbtn" disabled={count<=5} onClick={()=>setCount(n=>Math.max(5,n-1))}>&minus;</button>
          <div className="cn-num">{count}</div>
          <button className="stepbtn" disabled={count>=24} onClick={()=>setCount(n=>Math.min(24,n+1))}>+</button>
        </div>
        <div style={{display:'flex',gap:'6px',justifyContent:'center',flexWrap:'wrap',marginBottom:'28px'}}>
          {[8,10,12,15,18].map(n=>(
            <button key={n} className={`preset${count===n?' on':''}`} onClick={()=>setCount(n)}>{n}</button>
          ))}
        </div>
        <button className="btn-p" onClick={()=>setScreen('roles')}>Choisir les r&ocirc;les &rarr;</button>
      </div>
      <p style={{fontFamily:"'Cinzel',serif",fontSize:'11px',letterSpacing:'.25em',color:'rgba(245,230,200,.45)',marginTop:'30px',textTransform:'uppercase',textAlign:'center'}}>Play Thau'Gether</p>
    </div>
  );

  // Réordonner les joueurs (drag & drop)
  const reorderPlayers=(fromIdx,toIdx)=>{
    if(fromIdx===toIdx) return;
    setPlayers(prev=>{
      const arr=[...prev];
      const [moved]=arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      // Réassigner les IDs pour garder l'ordre visuel
      return arr.map((p,i)=>({...p,id:i+1}));
    });
  };

  /* ── ÉCRAN 2 : RÔLES ── */
  const incRole=rk=>{
    const w=roleWeight(rk);
    setActiveRoles(prev=>{
      const bonus=(prev['VOLEUR']||0)*2;
      const tot=Object.entries(prev).reduce((s,[k,v])=>s+v*roleWeight(k),0);
      if(tot+w>count+bonus) return prev;
      return {...prev,[rk]:(prev[rk]||0)+1};
    });
  };
  const decRole=rk=>{
    setActiveRoles(prev=>{
      const cur=prev[rk]||0; if(cur===0) return prev;
      const next=cur-1;
      if(next===0){const{[rk]:_,...rest}=prev;return rest;}
      return {...prev,[rk]:next};
    });
  };

  if(screen==='roles') return(
    <div className="rs" onClick={()=>setTooltip(null)}>
      <div className="ph">
        <div className="logo-slot"><img src="logo.png" alt="Loups-Garous" onError={e=>{e.target.style.display='none';}}/></div>
        <p style={{fontSize:'12px',letterSpacing:'.24em',color:'rgba(245,230,200,.7)',textTransform:'uppercase'}}>S&eacute;lection des r&ocirc;les</p>
      </div>
      <div className="orn">&#10022;</div>

      <div className="rs-grid">

        <div className="rcol">
          <div className="rcol-hdr">
            <span className="rcol-t">Joueurs</span>
            <span style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <span style={{fontFamily:"'Cinzel',serif",fontSize:'12px',color:'rgba(201,168,76,.5)'}}>{players.length}</span>
              <button className="pfold" onClick={e=>{e.stopPropagation();setPlayersFolded(f=>!f);}} aria-label="Replier la liste">{playersFolded?'\u25be':'\u25b4'}</button>
            </span>
          </div>
          <div className={`plist-body${playersFolded?' folded':''}`}>
            {players.map((p,i)=>{
              const unset=/^Joueur \d+$/.test(p.name);
              return(
                <div key={p.id}
                  className={`plist-row${dragIdx===i?' dragging':''}`}
                  draggable="true"
                  onContextMenu={e=>e.preventDefault()}
                  onDragStart={e=>{e.dataTransfer.effectAllowed='move';setDragIdx(i);}}
                  onDragEnd={()=>setDragIdx(null)}
                  onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';}}
                  onDrop={e=>{e.preventDefault();reorderPlayers(dragIdx,i);setDragIdx(null);}}
                >
                  <span className="drag-handle no-select">&#10287;</span>
                  <span className="plist-i">{i+1}</span>
                  <input
                    className={`plist-in${unset?' unset':''}`}
                    value={p.name}
                    onClick={e=>e.stopPropagation()}
                    onChange={e=>setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,name:e.target.value}:x))}
                    onFocus={e=>e.target.select()}
                  />
                </div>
              );
            })}
          </div>
        </div>

        <div className="rcol">
          <div className="rcol-hdr">
            <span className="rcol-t">R&ocirc;les</span>
            <span className={`rcol-n ${rem===0?'ok':'warn'}`}>
              {totalR} <span style={{opacity:.45,fontWeight:'400'}}>/ {count+voleurBonus2}</span>
            </span>
          </div>

          {Object.entries(TEAMS).map(([team,{label,keys}])=>(
            <div key={team} className="team-blk">
              <div className={`team-hdr ${team}`}>{label}</div>
              <div className="rgrid">
                {[...keys].sort((a,b)=>ROLES[a]?.name.localeCompare(ROLES[b]?.name,'fr')).map(rk=>{
                  const r=ROLES[rk];if(!r) return null;
                  const cnt=activeRoles[rk]||0,on=cnt>0;
                  return(
                    <div key={rk}
                      className={`rcard${on?` on on-${r.team}`:''}`}
                      onClick={e=>{e.stopPropagation();if(!on)incRole(rk);}}>
                      <button className="rinfo" onClick={e=>{e.stopPropagation();setTooltip(tooltip===rk?null:rk);}} aria-label="Description">&#8505;</button>
                      <div className="rcard-body">
                        <div className="rcard-emo">{r.emoji}</div>
                        <div className="rcard-nm">{r.name}</div>
                      </div>
                      {on&&(
                        <div className="rbar" onClick={e=>e.stopPropagation()}>
                          <button onClick={()=>decRole(rk)} aria-label="Retirer">&minus;</button>
                          <div className="rbar-n">{cnt}</div>
                          <button onClick={()=>incRole(rk)} aria-label="Ajouter">+</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          <div style={{display:'flex',gap:'8px',marginTop:'10px'}}>
            <button className="btn-g" onClick={()=>setScreen('count')}>&larr; Retour</button>
            <button className="btn-p" style={{flex:1}} disabled={rem!==0}
              onClick={()=>setScreen('game')}>
              {rem===0?'\u2694 Commencer la partie \u2694':rem>0?`Encore ${rem} r\u00f4le${rem>1?'s':''}`:`${Math.abs(rem)} r\u00f4le${Math.abs(rem)>1?'s':''} en trop`}
            </button>
          </div>
        </div>
      </div>

      {tooltip&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(4px)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}
          onClick={()=>setTooltip(null)}>
          <div style={{background:'linear-gradient(145deg,var(--parchment),var(--parchment-dark))',borderRadius:'8px',padding:'24px 20px',maxWidth:'340px',width:'100%',boxShadow:'0 8px 40px rgba(0,0,0,.8)',border:'1px solid rgba(201,168,76,.35)'}}
            onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:'center',marginBottom:'12px'}}>
              <div style={{fontSize:'52px',marginBottom:'6px'}}>{ROLES[tooltip]?.emoji}</div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:'18px',fontWeight:'700',color:'var(--ink)',marginBottom:'4px'}}>{ROLES[tooltip]?.name}</div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:'9px',letterSpacing:'.2em',textTransform:'uppercase',color:({loups:'var(--blood)',village:'var(--green)',solo:'var(--purple)',variable:'var(--amber)'})[ROLES[tooltip]?.team]||'var(--ink)'}}>{({loups:'\u2694 Loups',village:'\ud83c\udf3f Village',solo:'\u2b50 Solo',variable:'\ud83c\udf00 Variable'})[ROLES[tooltip]?.team]}</div>
            </div>
            <div style={{width:'100%',height:'1px',background:'linear-gradient(to right,transparent,rgba(139,100,30,.3),transparent)',marginBottom:'12px'}}/>
            <p style={{fontFamily:"'IM Fell English',serif",fontSize:'14px',fontStyle:'italic',color:'rgba(26,16,8,.72)',lineHeight:1.6,textAlign:'center'}}>{ROLES[tooltip]?.desc}</p>
            <button onClick={()=>setTooltip(null)} style={{marginTop:'16px',width:'100%',padding:'10px',background:'rgba(26,16,8,.08)',border:'1px solid rgba(26,16,8,.18)',borderRadius:'12px',fontFamily:"'Cinzel',serif",fontSize:'11px',letterSpacing:'.1em',cursor:'pointer',color:'rgba(26,16,8,.55)',textTransform:'uppercase'}}>Fermer</button>
          </div>
        </div>
      )}
      <p style={{fontFamily:"'Cinzel',serif",fontSize:'10px',letterSpacing:'.2em',color:'rgba(245,230,200,.4)',padding:'14px',textTransform:'uppercase',textAlign:'center'}}>Play Thau'Gether</p>
    </div>
  );

  /* ── ÉCRAN 3 : JEU ── */
  const n=players.length,cx=50,cy=50;
  // Géométrie proportionnelle au nombre de joueurs
  const rv = n<=10?38 : n<=14?42 : n<=18?46 : 50;
  const arcSpace = (2*Math.PI*rv)/Math.max(n,1);
  const nodeR = Math.max(4.2, Math.min(8, arcSpace*0.42));
  const nameMax = n<=10?9 : n<=16?7 : 5;
  const nameFS = Math.max(2.5, Math.min(3.8, nodeR*0.48));
  const emojiFS = nodeR*1.12;
  const nameDY = nodeR + nameFS + 1.2;
  const svgHalf = rv + nodeR + 9;
  const viewBox = `${cx-svgHalf} ${cy-svgHalf} ${svgHalf*2} ${svgHalf*2}`;
  // Un rôle n'apparaît dans la bande que si le joueur qui l'a est encore vivant
  const NEEDS_ALIVE=['VOYANTE','CORBEAU','SALVATORE','SORCIERE','RENARD','COMEDIEN',
    'INFECT_PERE','GRAND_MECHANT_LOUP','JOUEUR_FLUTE','LOUP_BLANC','SINGE_SAVANT','PUISSANTE_MERE','COLOSSE'];
  const nightBarItems=EVERY_NIGHT.filter(it=>{
    if(it.role==='CHARMED') return activeRoles['JOUEUR_FLUTE']>0 && players.some(p=>p.alive&&p.enchanted);
    if(it.role==='LOUP') return players.some(p=>p.alive&&isWolf(p));
    if(it.role==='PUISSANTE_MERE'&&nightCount>2) return false;
    // Rôles avec joueur : seulement si ce joueur est vivant
    if(NEEDS_ALIVE.includes(it.role)) return activeRoles[it.role]>0 && players.some(p=>p.alive&&p.role===it.role);
    return activeRoles[it.role]>0;
  });
  const bear=players.find(p=>p.role==='MONTREUR_OURS'&&p.alive);
  const availRoles=Object.keys(activeRoles);

  const lastNightVictim=lastNight?.wolfVictimId?players.find(p=>p.id===lastNight.wolfVictimId):null;
  const lastNightPoisoned=lastNight?.potionDeathId?players.find(p=>p.id===lastNight.potionDeathId):null;
  const lastNightCorbeau=lastNight?.corbeauId?players.find(p=>p.id===lastNight.corbeauId):null;
  const lastNightLB=lastNight?.loupBlancId?players.find(p=>p.id===lastNight.loupBlancId):null;

  return(
    <div className="gs">
      {/* ── HEADER JEU ── */}
      <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center',padding:'6px 0',minHeight:'56px'}}>
        {/* Logo PNG — position absolue à gauche */}
        <div style={{position:'absolute',left:0,display:'flex',alignItems:'center'}}>
          <img src="logo.png" alt="" style={{height:'48px',width:'auto',objectFit:'contain',opacity:.9,display:'block'}} onError={e=>{e.target.style.display='none';}}/>
        </div>
        {/* Centre parfaitement centré */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}>
          <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'clamp(20px,4vw,30px)',color:'var(--gold-bright)',letterSpacing:'.05em',textShadow:'0 0 20px rgba(201,168,76,.5)',lineHeight:1}}>NUIT {nightCount}</div>
          <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
            <span className="gstat w">🐺 {stats.wolves} loup{stats.wolves>1?'s':''}</span>
            <span className="gstat v">🌿 {stats.village} village</span>
          </div>
        </div>
        {/* Boutons droite */}
        <div style={{position:'absolute',right:0,display:'flex',gap:'6px'}}>
          <button className="ibtn" title="Réorganiser les joueurs" onClick={()=>setShowReorder(true)}>🔀</button>
          <button className="ibtn" title="Nouvelle partie" onClick={openReset}>🔄</button>
        </div>
      </div>

      {/* ── BANDEAU OURS — au-dessus de la table ── */}
      {bear&&bear.bearGrowl&&(
        <div style={{
          background:'linear-gradient(135deg,rgba(139,26,26,.4),rgba(80,5,5,.45))',
          border:'2px solid rgba(200,50,50,.75)',
          borderRadius:'6px',padding:'10px 20px',
          display:'flex',alignItems:'center',justifyContent:'center',gap:'12px',
          animation:'bpls 1.2s ease-in-out infinite',
        }}>
          <span style={{fontSize:'32px'}}>🐻</span>
          <div>
            <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'16px',color:'#ff5555',letterSpacing:'.05em'}}>L'OURS GROGNE !</div>
            <div style={{fontFamily:"'IM Fell English',serif",fontSize:'13px',fontStyle:'italic',color:'rgba(255,160,160,.85)'}}>Un voisin de {bear.name} est un loup</div>
          </div>
        </div>
      )}
      {bear&&!bear.bearGrowl&&(
        <div style={{
          background:'rgba(45,90,61,.1)',border:'1px solid rgba(45,90,61,.25)',
          borderRadius:'12px',padding:'5px 14px',
          display:'flex',alignItems:'center',gap:'8px',
        }}>
          <span style={{fontSize:'16px'}}>🐻</span>
          <span style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',color:'rgba(100,180,120,.65)',fontStyle:'italic'}}>L'ours de {bear.name} est calme</span>
        </div>
      )}

      {/* ── CERCLE TABLE ── */}
      <div style={{display:'flex',justifyContent:'center'}}>
        <div className="board" style={{margin:0,width:'min(100vw, 100vh - 200px)',maxWidth:'680px'}}>
        <svg ref={svgRef} viewBox={viewBox} className="csvg">
          <circle cx={cx} cy={cy} r="13" fill="rgba(201,168,76,.05)" stroke="rgba(201,168,76,.2)" strokeWidth=".6"/>
          <text x={cx} y={cy-2} textAnchor="middle" style={{fontFamily:"'Cinzel',serif",fontSize:'3.5px',fill:'rgba(201,168,76,.5)',letterSpacing:'.15em'}}>NUIT</text>
          <text x={cx} y={cy+3} textAnchor="middle" style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'6px',fill:'rgba(201,168,76,.7)',fontWeight:'bold'}}>{nightCount}</text>
          {players.filter(p=>p.lover&&p.loverId&&p.id<p.loverId).map(p=>{
            const pi=players.findIndex(x=>x.id===p.id),li=players.findIndex(x=>x.id===p.loverId);
            const a1=(360/n)*pi-90,a2=(360/n)*li-90;
            const x1=cx+rv*Math.cos(a1*Math.PI/180),y1=cy+rv*Math.sin(a1*Math.PI/180);
            const x2=cx+rv*Math.cos(a2*Math.PI/180),y2=cy+rv*Math.sin(a2*Math.PI/180);
            return <line key={p.id} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#c06090" strokeWidth=".3" strokeDasharray="1,.8" opacity=".5"/>;
          })}
          {/* Ligne pointillée verte : Enfant Sauvage → son modèle */}
          {players.filter(p=>p.role==='ENFANT_SAUVAGE'&&p.model&&p.alive).map(p=>{
            const es=players.find(x=>x.id===p.id), mo=players.find(x=>x.id===p.model);
            if(!mo) return null;
            const pi=players.findIndex(x=>x.id===es.id),mi=players.findIndex(x=>x.id===mo.id);
            const a1=(360/n)*pi-90,a2=(360/n)*mi-90;
            const x1=cx+rv*Math.cos(a1*Math.PI/180),y1=cy+rv*Math.sin(a1*Math.PI/180);
            const x2=cx+rv*Math.cos(a2*Math.PI/180),y2=cy+rv*Math.sin(a2*Math.PI/180);
            return <g key={`es-${p.id}`}>
              <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#88cc44" strokeWidth=".4" strokeDasharray="1.2,.6" opacity=".7"/>
              <text x={(x1+x2)/2} y={(y1+y2)/2-1} textAnchor="middle" style={{fontSize:'3px',fill:'#88cc44',opacity:.8}}>🧒</text>
            </g>;
          })}
          {players.map((p,i)=>{
            const angle=(360/n)*i-90,rad=angle*Math.PI/180;
            const px=cx+rv*Math.cos(rad),py=cy+rv*Math.sin(rad);
            const dead=!p.alive,wolf=isWolf(p),role=ROLES[p.role];
            const ring=dead?'rgba(100,80,60,.32)':wolf?'rgba(139,26,26,.82)':role?.team==='village'?'rgba(45,90,61,.68)':role?.team==='solo'?'rgba(74,32,96,.68)':'rgba(201,168,76,.5)';
            const bg=dead?'rgba(40,30,20,.88)':wolf?'rgba(72,7,7,.9)':'rgba(20,14,5,.9)';
            const tc=dead?'rgba(180,150,100,.35)':wolf?'#ff9999':'#f5e6c8';
            return(
              <g key={p.id} className="pnode"
                transform={`translate(${px},${py})`}
                onClick={()=>setSelId(selId===p.id?null:p.id)}
                style={{cursor:'pointer'}}>
                {p.bearGrowl&&p.alive&&(<>
                  {/* Halo rouge solide fixe */}
                  <circle r={nodeR+2.5} fill="none" stroke="rgba(220,50,50,.9)" strokeWidth={nodeR*.25}/>
                  {/* Anneau pulsant */}
                  <circle r={nodeR+2} fill="none" stroke="rgba(255,80,80,.7)" strokeWidth={nodeR*.19}>
                    <animate attributeName="r" values={`${nodeR+2};${nodeR+6};${nodeR+2}`} dur="1.2s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values=".8;0;.8" dur="1.2s" repeatCount="indefinite"/>
                  </circle>
                  {/* Petit symbole 🐻 au-dessus du cercle */}
                  <text textAnchor="middle" y={-(nodeR+4)} style={{fontSize:`${nameFS*1.1}px`,fill:'#ff6666'}}>🐻!</text>
                </>)}
                <circle r={nodeR} fill={bg} stroke={ring} strokeWidth={dead?nodeR*.048:nodeR*.12} strokeOpacity={dead?.32:.88}/>
                <text textAnchor="middle" y="0" dominantBaseline="central" style={{fontSize:`${dead?emojiFS*.84:emojiFS}px`,opacity:dead?.38:1}}>{role?.emoji||'❓'}</text>
                <text textAnchor="middle" y={nameDY} style={{fontFamily:"'IM Fell English',serif",fontSize:`${nameFS}px`,fill:tc,fontStyle:dead?'italic':'normal'}}>
                  {p.name.length>nameMax?p.name.slice(0,nameMax-1)+'…':p.name}
                </text>
                {!dead&&(p.mute||p.powerless)&&(
                  <text x={nodeR*.78} y={-nodeR*.62} textAnchor="middle" dominantBaseline="central" style={{fontSize:`${nameFS*1.05}px`}}>{p.powerless?'⛔':'🤐'}</text>
                )}
                {dead&&<>
                  <line x1={-nodeR*.62} y1={-nodeR*.62} x2={nodeR*.62} y2={nodeR*.62} stroke="rgba(139,26,26,.42)" strokeWidth={nodeR*.094}/>
                  <line x1={nodeR*.62} y1={-nodeR*.62} x2={-nodeR*.62} y2={nodeR*.62} stroke="rgba(139,26,26,.42)" strokeWidth={nodeR*.094}/>
                </>}

              </g>
            );
          })}
        </svg>
        </div>
      </div>

      {/* ══ PANNEAU BAS — HORIZONTAL ══ */}
      <div style={{width:'100%',marginTop:'12px',display:'flex',flexDirection:'column',gap:'10px'}}>

        {/* Boutons côte à côte */}
        <div style={{display:'flex',gap:'10px'}}>
          <button className="gbtn first" onClick={()=>{setNightIdx(0);setShowNight(true);}}>🌙 1ère nuit</button>
          <button className="gbtn next" onClick={()=>{setEveryNightIdx(0);setShowEveryNight(true);}}>✦ Nuit suivante</button>
        </div>
        {/* Récap + Ordre de nuit côte à côte */}
        <div style={{display:'flex',gap:'10px',alignItems:'flex-start'}}>

          {lastNight&&(
            <div style={{flex:2,background:'linear-gradient(160deg,var(--parchment) 0%,var(--parchment-dark) 100%)',borderRadius:'14px',border:'1px solid rgba(201,168,76,.35)',padding:'13px 15px',maxHeight:'240px',overflowY:'auto',boxShadow:'0 10px 30px rgba(0,0,0,.35)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px',borderBottom:'1px solid rgba(139,100,30,.2)',paddingBottom:'6px'}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:'10px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--blood)'}}>📜 Résumé — Nuit {lastNight.nightNumber}</div>
                {(()=>{
                  const nd=[];
                  if(Array.isArray(lastNight.deadIds)) nd.push(...lastNight.deadIds);
                  else {
                    // Ancien format de sauvegarde
                    if(lastNight.wolfVictimId&&!lastNight.wolfVictimSaved&&!lastNight.infectTransformed) nd.push(lastNight.wolfVictimId);
                    if(lastNight.gmgVictimId) nd.push(lastNight.gmgVictimId);
                    if(lastNight.potionDeathId) nd.push(lastNight.potionDeathId);
                    if(lastNight.loupBlancId) nd.push(lastNight.loupBlancId);
                  }
                  const unique=[...new Set(nd)];
                  return <div style={{fontFamily:"'Cinzel',serif",fontSize:'11px',fontWeight:'700',color:unique.length===0?'var(--green)':'var(--blood)',background:unique.length===0?'rgba(45,90,61,.15)':'rgba(139,26,26,.12)',border:`1px solid ${unique.length===0?'var(--green)':'var(--blood)'}`,borderRadius:'10px',padding:'2px 10px'}}>💀 {unique.length} mort{unique.length>1?'s':''}</div>;
                })()}
              </div>
              {(()=>{
                const S=({color='var(--blood)',children})=><div style={{fontFamily:"'Cinzel',serif",fontSize:'9px',letterSpacing:'.1em',color,marginBottom:'3px',textTransform:'uppercase',fontWeight:'700'}}>{children}</div>;
                const V=({children,bold})=><div style={{fontFamily:"'IM Fell English',serif",fontSize:'13px',color:'#1a1008',fontWeight:bold?'900':'normal',lineHeight:1.3}}>{children}</div>;
                const Bloc=({children})=><div style={{borderTop:'1px solid rgba(139,100,30,.2)',paddingTop:'5px',marginTop:'4px'}}>{children}</div>;
                const N=(id)=>players.find(p=>p.id===id)?.name||'?';
                const events=[];

                // ── MORTS
                const lnv=lastNight?.wolfVictimId?players.find(p=>p.id===lastNight.wolfVictimId):null;
                if(lnv) events.push(<Bloc key="w"><S>🐺 Dévoré par les loups</S><V bold>{lnv.name} <span style={{fontSize:'10px',opacity:.6}}>({ROLES[lnv.role]?.name})</span></V>{lastNight.puppetId===lnv.id&&<V><span style={{color:'var(--green)',fontSize:'11px'}}>🪆 Sa marionnette meurt à sa place</span></V>}{lastNight.wolfVictimSaved&&<V><span style={{color:'var(--green)',fontSize:'11px'}}>{lastNight.saviorType==='salvateur'?'🛡️ Sauvé par le Salvateur':'🧪 Sauvé par la potion'}</span></V>}</Bloc>);
                else events.push(<Bloc key="nw"><V><span style={{fontStyle:'italic',color:'rgba(26,16,8,.45)',fontSize:'11px'}}>Aucune victime des loups</span></V></Bloc>);
                if(lastNight.gmgVictimId) events.push(<Bloc key="g"><S>👹 2ème victime (Grand Méchant Loup)</S><V bold>{N(lastNight.gmgVictimId)} <span style={{fontSize:'10px',opacity:.6}}>({ROLES[players.find(p=>p.id===lastNight.gmgVictimId)?.role]?.name})</span></V></Bloc>);
                if(lastNight.infectTransformed) events.push(<Bloc key="inf"><S>🦠 Transformé en loup (Infect Père)</S><V bold>{N(lastNight.infectTransformed)}</V></Bloc>);
                if(lastNight.loupBlancId) events.push(<Bloc key="lb"><S>🤍 Tué par le Loup Blanc</S><V bold>{N(lastNight.loupBlancId)}</V></Bloc>);
                const lnp=lastNight?.potionDeathId?players.find(p=>p.id===lastNight.potionDeathId):null;
                if(lnp) events.push(<Bloc key="pd"><S color="var(--purple)">☠️ Tué par la potion de mort</S><V bold>{lnp.name}</V></Bloc>);

                // ── SAUVETAGES / PROTECTION
                if(lastNight.potionLifeUsed&&lastNight.potionLifeTargetId) events.push(<Bloc key="pv"><S color="var(--green)">🧪 Potion de vie utilisée</S><V bold>{N(lastNight.potionLifeTargetId)} — survit</V></Bloc>);
                if(lastNight.salvateurId) events.push(<Bloc key="salv"><S color="var(--green)">🛡️ Protégé par le Salvateur</S><V bold>{N(lastNight.salvateurId)}</V></Bloc>);

                // ── CORBEAU
                if(lastNight.corbeauId) events.push(<Bloc key="corb"><S color="rgba(80,80,130,1)">🦅 Curseur Corbeau (+2 votes)</S><V bold>{N(lastNight.corbeauId)}</V></Bloc>);

                // ── VOYANTE
                if(lastNight.voyanteTargetId) events.push(<Bloc key="voy"><S color="rgba(80,60,120,1)">🔮 Voyante a inspecté</S><V bold>{N(lastNight.voyanteTargetId)}</V><V><span style={{color:lastNight.voyanteTargetIsWolf?'var(--blood)':'var(--green)',fontSize:'11px'}}>{lastNight.voyanteTargetIsWolf?"🐺 C'est un loup !":'✅ Pas un loup'}</span></V></Bloc>);

                // ── RENARD
                if(lastNight.renardTargetIds?.length) events.push(<Bloc key="ren"><S color="var(--amber)">🦊 Renard a inspecté</S><V>{lastNight.renardTargetIds.map(id=>N(id)).join(', ')}</V><V><span style={{color:lastNight.renardResult?'var(--blood)':'var(--green)',fontSize:'11px'}}>{lastNight.renardResult?"🐺 Loup détecté !":'Aucun loup'}{lastNight.renardLostPower?' — pouvoir perdu':''}</span></V></Bloc>);

                // ── FLÛTE
                if(lastNight.newEnchantedIds?.length) events.push(<Bloc key="flute"><S color="var(--purple)">🎵 Nouveaux enchantés (Flûte)</S><V bold>{lastNight.newEnchantedIds.map(id=>N(id)).join(' & ')}</V>{lastNight.enchantedIds?.length>lastNight.newEnchantedIds?.length&&<V><span style={{fontSize:'11px',opacity:.6}}>Total : {lastNight.enchantedIds.map(id=>N(id)).join(', ')}</span></V>}</Bloc>);

                // ── NOUVEAUX RÔLES
                if(lastNight.colosseKillId) events.push(<Bloc key="col"><S>💪 Riposte du Colosse</S><V bold>{N(lastNight.colosseKillId)} <span style={{fontSize:'10px',opacity:.6}}>(emporté)</span></V></Bloc>);
                if(lastNight.singeOut) events.push(<Bloc key="singe"><S color="var(--amber)">🐒 Singe Savant est sorti</S><V>{(lastNight.singeTargets||[]).map(t=>N(t.id)).join(', ')||'—'}</V><V><span style={{color:lastNight.singeDied?'var(--blood)':'var(--green)',fontSize:'11px'}}>{lastNight.singeDied?'🐺 A découvert un Loup — mort':'Que des Villageois'}</span></V></Bloc>);
                if(lastNight.mereTargetId) events.push(<Bloc key="mere"><S>👑 Mère des Loups a ciblé</S><V bold>{N(lastNight.mereTargetId)}</V><V><span style={{fontSize:'11px',color:lastNight.mereEffective?'var(--blood)':'rgba(26,16,8,.5)'}}>{lastNight.mereEffective?'Pouvoir supprimé':'Aucun effet'}</span></V></Bloc>);
                if(lastNight.loverDeaths?.length) events.push(<Bloc key="chag"><S color="#c06090">💔 Mort de chagrin</S><V bold>{lastNight.loverDeaths.map(id=>N(id)).join(', ')}</V></Bloc>);

                // ── 1ÈRE NUIT SPÉCIALE
                if(lastNight.isFirstNight){
                  if(lastNight.loversIds?.length===2) events.push(<Bloc key="cup"><S color="#c06090">💘 Amoureux (Cupidon)</S><V bold>{lastNight.loversIds.map(id=>N(id)).join(' & ')}</V></Bloc>);
                  if(lastNight.chienLoupId) events.push(<Bloc key="cl"><S color="var(--amber)">🐕 Chien-Loup a choisi</S><V bold><span style={{color:lastNight.chienLoupCamp==='loups'?'var(--blood)':'var(--green)'}}>{lastNight.chienLoupCamp==='loups'?'🐺 Camp des Loups':'🌿 Camp Village'}</span></V></Bloc>);
                  if(lastNight.enfantSauvageId&&lastNight.enfantSauvageModelId) events.push(<Bloc key="es"><S color="var(--green)">🧒 Modèle Enfant Sauvage</S><V bold>{N(lastNight.enfantSauvageModelId)}</V></Bloc>);
                  if(lastNight.voleurId&&lastNight.voleurChosenRole) events.push(<Bloc key="vol"><S color="var(--amber)">🃏 Voleur a pris le rôle</S><V bold>{ROLES[lastNight.voleurChosenRole]?.emoji} {ROLES[lastNight.voleurChosenRole]?.name}</V></Bloc>);
                }

                return <div style={{
                  display:'grid',
                  gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',
                  gap:'0 12px',
                  alignItems:'start'
                }}>{events}</div>;
              })()}
            </div>
          )}

          {/* Ordre de nuit */}
          <div className="gorder">
            <div className="gorder-t">Ordre de nuit</div>
            {nightBarItems.map((it,i)=>(
              <div key={i} className="gorder-i">
                <span className="gorder-n">{i+1}</span>
                <span style={{fontSize:'15px'}}>{ROLES[it.role]?.emoji||'✦'}</span>
                <span className="gorder-l">{it.name}</span>
              </div>
            ))}
          </div>

        </div>{/* fin flex récap+ordre */}
      </div>{/* fin panneau bas */}

      {/* Modal joueur */}
      {selId&&(()=>{
        const p=players.find(x=>x.id===selId);if(!p) return null;
        const role=ROLES[p.role];
        return(
          <div className="ov" onClick={()=>{setSelId(null);setServanteAsk(null);}}>
            <div className="pmod" onClick={e=>e.stopPropagation()}>
              <div className="mod-name">{p.name}</div>
              <div className="mod-rl">
                <span style={{fontSize:'20px'}}>{role?.emoji||'❓'}</span>
                <span>{role?.name||'Sans rôle'}</span>
                {p.alive?<span style={{marginLeft:'auto',color:'var(--green)',fontSize:'11px',fontFamily:"'Cinzel',serif"}}>VIVANT</span>:<span style={{marginLeft:'auto',color:'var(--blood)',fontSize:'11px',fontFamily:"'Cinzel',serif"}}>✝ MORT</span>}
              </div>
              {role?.desc&&<p className="mod-desc">{role.desc}</p>}
              {/* Infos supplémentaires joueur */}
              {p.lover&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'#c06090',marginBottom:'6px'}}>💘 Amoureux de {players.find(x=>x.id===p.loverId)?.name||'?'}</div>}
              {p.role==='ENFANT_SAUVAGE'&&p.model&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'var(--green)',marginBottom:'6px'}}>🌿 Modèle : {players.find(x=>x.id===p.model)?.name||'?'}</div>}
              {p.enchanted&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'var(--purple)',marginBottom:'6px'}}>🎵 Joueur charmé</div>}
              {isWolf(p)&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'var(--blood)',marginBottom:'6px'}}>🐺 Camp des Loups</div>}
              {p.mute&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'var(--amber)',marginBottom:'6px'}}>🪆 Marionnette utilisée — ne peut plus parler, seulement voter</div>}
              {p.powerless&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'var(--blood)',marginBottom:'6px'}}>👑 Pouvoir supprimé par la Mère des Loups</div>}
              {p.role==='SINGE_SAVANT'&&p.singeUsed&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'rgba(26,16,8,.55)',marginBottom:'6px'}}>🐒 Pouvoir déjà utilisé</div>}
              {/* Changer le rôle */}
              <div style={{marginTop:'8px',borderTop:'1px solid rgba(139,100,30,.15)',paddingTop:'8px'}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:'9px',letterSpacing:'.15em',color:'rgba(26,16,8,.45)',textTransform:'uppercase',marginBottom:'6px'}}>Changer le rôle</div>
                <select
                  value={p.role||''}
                  onChange={e=>{
                    const rk=e.target.value;
                    if(!rk) return;
                    setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,role:rk,team:ROLES[rk]?.team||x.team,isInfected:false}:x));
                  }}
                  style={{width:'100%',background:'rgba(26,16,8,.05)',border:'1px solid rgba(139,100,30,.3)',borderRadius:'12px',fontFamily:"'IM Fell English',serif",fontSize:'14px',color:'var(--ink)',padding:'8px 10px',outline:'none',cursor:'pointer'}}>
                  <option value="">— Sélectionner un rôle —</option>
                  {Object.keys(activeRoles).filter(rk=>activeRoles[rk]>0).sort((a,b)=>ROLES[a]?.name.localeCompare(ROLES[b]?.name,'fr')).map(rk=>(
                    <option key={rk} value={rk}>{ROLES[rk]?.emoji} {ROLES[rk]?.name}{p.role===rk?' ✓':''}</option>
                  ))}
                </select>
              </div>
              {servanteAsk===p.id&&(()=>{
                const serv=players.find(x=>x.role==='SERVANTE'&&x.alive&&x.id!==p.id);
                if(!serv) return null;
                return(
                  <div className="servq">
                    <div className="servq-t">🧹 La Servante Dévouée prend-elle la place de {p.name}&nbsp;?</div>
                    <div className="servq-s">Seulement en cas d'élimination par le vote du village. Servante : {serv.name}</div>
                    <div style={{display:'flex',gap:'8px',marginTop:'10px'}}>
                      <button className="mb cls" style={{flex:1}} onClick={()=>{toggleAlive(p.id);setServanteAsk(null);setSelId(null);}}>Non, {p.name} meurt</button>
                      <button className="mb rev" style={{flex:1}} onClick={()=>{servanteTakes(p.id);setServanteAsk(null);setSelId(null);}}>Oui, elle prend son rôle</button>
                    </div>
                  </div>
                );
              })()}
              <div className="mod-btns" style={{marginTop:'8px'}}>
                {p.alive?(servanteAsk===p.id?null:<button className="mb kill" onClick={()=>{
                  const serv=players.find(x=>x.role==='SERVANTE'&&x.alive&&x.id!==p.id&&!x.powerless);
                  if(serv){setServanteAsk(p.id);return;}
                  toggleAlive(p.id);setSelId(null);
                }}>🗡️ Tuer le joueur</button>):<button className="mb rev" onClick={()=>{toggleAlive(p.id);setSelId(null);}}>↩ Ressusciter</button>}
                {/* Transformer en loup — visible si le joueur est vivant et pas déjà loup */}
                {p.alive&&!isWolf(p)&&(
                  <button className="mb kill" style={{background:'linear-gradient(135deg,rgba(139,26,26,.2),rgba(80,5,5,.25))',borderColor:'rgba(139,26,26,.5)',color:'var(--blood)'}}
                    onClick={()=>{
                      setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,isInfected:true,team:'loups'}:x));
                      setSelId(null);
                    }}>
                    🐺 Transformer en Loup-Garou
                  </button>
                )}
                {p.alive&&isWolf(p)&&(
                  <button className="mb cls" style={{borderColor:'rgba(45,90,61,.4)',color:'var(--green)'}}
                    onClick={()=>{
                      setPlayers(prev=>prev.map(x=>x.id===p.id?{...x,isInfected:false,team:ROLES[x.role]?.team||'village'}:x));
                      setSelId(null);
                    }}>
                    🌿 Retirer du camp Loups
                  </button>
                )}
                <button className="mb cls" onClick={()=>{setSelId(null);setServanteAsk(null);}}>Fermer</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── MODALE RESET ── */}
      {/* ── MODAL RÉORGANISATION ── */}
      {showReorder&&(
        <div className="ov" onClick={()=>setShowReorder(false)}>
          <div style={{background:'linear-gradient(160deg,var(--parchment),var(--parchment-dark))',borderRadius:'18px',padding:'22px',width:'min(380px,92vw)',maxHeight:'80vh',overflowY:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.8)',border:'1px solid rgba(201,168,76,.35)'}}
            onClick={e=>e.stopPropagation()}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:'14px',fontWeight:'700',color:'var(--blood)',textAlign:'center',marginBottom:'4px',letterSpacing:'.05em'}}>🔀 Réorganiser les joueurs</div>
            <p style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'rgba(26,16,8,.5)',textAlign:'center',marginBottom:'14px'}}>Glissez les joueurs pour changer leur place à la table</p>
            <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
              {players.map((p,i)=>(
                <div key={p.id}
                  className={`player-row${dragIdx===i?' dragging':''}`}
                  draggable="true"
                  onContextMenu={e=>e.preventDefault()}
                  onDragStart={e=>{e.dataTransfer.effectAllowed='move';setDragIdx(i);}}
                  onDragEnd={()=>setDragIdx(null)}
                  onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';}}
                  onDrop={e=>{e.preventDefault();reorderPlayers(dragIdx,i);setDragIdx(null);}}
                  style={{background:dragIdx===i?'rgba(201,168,76,.1)':'transparent',borderRadius:'12px',transition:'background .15s'}}
                >
                  <span className="drag-handle no-select" style={{fontSize:'16px'}}>⠿</span>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:'11px',color:'var(--blood)',width:'20px',flexShrink:0,textAlign:'center'}}>{i+1}</span>
                  <span style={{fontFamily:"'IM Fell English',serif",fontSize:'16px',color:'var(--ink)',flex:1}}>{p.name}</span>
                  {p.role&&<span style={{fontSize:'18px'}}>{ROLES[p.role]?.emoji}</span>}
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:'9px',color:p.alive?'var(--green)':'var(--blood)',padding:'2px 6px',border:`1px solid ${p.alive?'var(--green)':'var(--blood)'}`,borderRadius:'8px'}}>{p.alive?'vivant':'mort'}</span>
                </div>
              ))}
            </div>
            <button onClick={()=>setShowReorder(false)}
              style={{marginTop:'16px',width:'100%',padding:'12px',background:'rgba(26,16,8,.06)',border:'1px solid rgba(26,16,8,.18)',borderRadius:'12px',fontFamily:"'Cinzel',serif",fontSize:'12px',letterSpacing:'.1em',cursor:'pointer',color:'rgba(26,16,8,.6)',textTransform:'uppercase'}}>
              ✓ Confirmer
            </button>
          </div>
        </div>
      )}

      {showReset&&(
        <div className="ov" onClick={()=>setShowReset(false)}>
          <div className="pmod" style={{maxWidth:'460px',maxHeight:'80vh',overflow:'hidden',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
              <div className="mod-name" style={{fontSize:'17px'}}>🔄 Nouvelle partie</div>
              <button onClick={()=>setShowReset(false)} style={{background:'none',border:'none',color:'rgba(26,16,8,.4)',fontSize:'20px',cursor:'pointer'}}>✕</button>
            </div>
            <p style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'rgba(26,16,8,.5)',marginBottom:'12px',lineHeight:1.4}}>
              Qui joue la prochaine partie ? Clique pour retirer un joueur.
            </p>
            <div style={{overflowY:'auto',flex:1,marginBottom:'12px',display:'flex',flexDirection:'column',gap:'6px'}}>
              {resetKeep.map(p=>(
                <div key={p.id}
                  style={{display:'flex',alignItems:'center',gap:'8px',padding:'8px 10px',borderRadius:'10px',border:`1px solid ${p.keep?'rgba(45,90,61,.4)':'rgba(139,26,26,.3)'}`,background:p.keep?'rgba(45,90,61,.08)':'rgba(139,26,26,.06)',cursor:'pointer',transition:'all .15s'}}
                  onClick={()=>setResetKeep(prev=>prev.map(x=>x.id===p.id?{...x,keep:!x.keep}:x))}>
                  <span style={{fontSize:'16px'}}>{p.keep?'✓':'✗'}</span>
                  <span style={{fontFamily:"'IM Fell English',serif",fontSize:'14px',color:p.keep?'var(--ink)':'rgba(26,16,8,.38)',flex:1,textDecoration:p.keep?'none':'line-through'}}>{p.name}</span>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:'9px',letterSpacing:'.1em',color:p.keep?'var(--green)':'var(--blood)'}}>{p.keep?'JOUE':'PART'}</span>
                </div>
              ))}
              {/* Ajouter un joueur */}
              <button
                style={{padding:'8px',background:'transparent',border:'1px dashed rgba(26,16,8,.2)',borderRadius:'10px',fontFamily:"'Cinzel',serif",fontSize:'10px',letterSpacing:'.12em',color:'rgba(26,16,8,.4)',cursor:'pointer',transition:'all .2s'}}
                onClick={()=>setResetKeep(prev=>[...prev,{id:Date.now(),name:`Joueur ${prev.length+1}`,keep:true}])}>
                ➕ Ajouter un joueur
              </button>
            </div>
            <div style={{display:'flex',gap:'8px'}}>
              <button className="btn-g" style={{flex:1}} onClick={()=>setShowReset(false)}>Annuler</button>
              <button className="btn-p" style={{flex:2}} disabled={resetKeep.filter(p=>p.keep).length<5} onClick={confirmReset}>
                Valider ({resetKeep.filter(p=>p.keep).length} joueurs)
              </button>
            </div>
            {resetKeep.filter(p=>p.keep).length<5&&<p style={{fontFamily:"'IM Fell English',serif",fontSize:'11px',fontStyle:'italic',color:'var(--blood)',textAlign:'center',marginTop:'6px'}}>Minimum 5 joueurs requis</p>}
          </div>
        </div>
      )}

      {showNight&&<NightSlide slides={nightSlides} idx={nightIdx} setIdx={setNightIdx} players={players} setPlayers={setPlayers} na={na} setNA={setNA} onClose={()=>setShowNight(false)} onFinish={()=>{applyNight();setNightCount(n=>n+1);}} assignRole={assignRole} title="✦ Première Nuit ✦" isFirstNight={true} voleurChosenRole={voleurChosenRole} setVoleurChosenRole={setVoleurChosenRole} activeRoles={activeRoles} setPlayers={setPlayers} lastSalvateurTarget={null}/>}
      {showEveryNight&&<NightSlide slides={everyNightSlides} idx={everyNightIdx} setIdx={setEveryNightIdx} players={players} setPlayers={setPlayers} na={na} setNA={setNA} onClose={()=>setShowEveryNight(false)} onFinish={()=>{applyNight();setNightCount(n=>n+1);setShowEveryNight(false);}} assignRole={assignRole} title="✦ Déroulé de la Nuit ✦" isFirstNight={false} activeRoles={activeRoles} lastSalvateurTarget={lastSalvateurTarget}/>}
    </div>
  );
}

function NightSlide({slides,idx,setIdx,players,setPlayers,na,setNA,onClose,onFinish,assignRole,title,isFirstNight,voleurChosenRole,setVoleurChosenRole,activeRoles,lastSalvateurTarget}){
  const slide=slides[idx];
  const isRecap=slide.role==='RECAP';
  const role=slide.role;
  const ri=ROLES[role];
  const team=role==='LOUP'?'loups':role==='LOVER'?'solo':role==='CHARMED'?'variable':role==='RECAP'?'recap':ri?.team;
  const tc={loups:'tl',village:'tv',solo:'ts',variable:'ta',recap:'tr'}[team]||'tv';

  const getAssigned=r=>{
    if(r==='LOUP') return players.filter(p=>isWolf(p)&&p.alive);
    if(r==='LOVER') return players.filter(p=>p.lover&&p.alive);
    if(r==='CHARMED') return players.filter(p=>p.enchanted&&p.alive);
    return players.filter(p=>p.role===r&&p.alive);
  };

  const wolfVP=players.find(p=>p.id===na.wolfVictim);
  const corbP=players.find(p=>p.id===na.corbeauTarget);
  const salSaved=na.salvateurTarget&&na.wolfVictim&&na.salvateurTarget===na.wolfVictim;
  const potSaved=na.potionLifeUsed&&na.wolfVictim;

  // Rôles "simples" de la première nuit : juste assigner + info
  const SIMPLE_FIRST=['VILLAGEOIS','ANCIEN','CHASSEUR','ANGE','CHEVALIER','BOUC','PETITE_FILLE','IDIOT','MONTREUR_OURS','JUGE_BEGUE','LOUP_BLANC','MARIONNETTISTE','SERVANTE','COLOSSE'];
  // RENARD a son propre bloc UI — ENFANT_SAUVAGE est dans SIMPLE + a un bloc modèle en bonus
  const isSimpleFirstNight=isFirstNight&&SIMPLE_FIRST.includes(role);
  const cur=getAssigned(role);
  const lbActif=slide.actif!==false; // pour loup blanc : actif=false = nuit de repos
  // Joueur assigné à ce rôle transformé en loup ? → bloquer ses actions
  const assignedForRole=role==='LOUP'||role==='LOVER'||role==='CHARMED'?null:players.find(p=>p.role===role&&p.alive);
  const rolePlayerInfected=assignedForRole?.isInfected===true||isPowerless(assignedForRole,na);

  return(
    <div className="nsw">
      <div className="nsprog"><div className="nspf" style={{width:`${((idx+1)/slides.length)*100}%`}}/></div>
      <div className="nshdr">
        <span className="nscnt">{idx+1} / {slides.length}</span>
        <span className="nstit">{title||'✦ Nuit ✦'}</span>
        <button className="nscls" onClick={onClose}>✕</button>
      </div>

      <div className="nsbody">
        {/* RÉCAP */}
        {isRecap&&(()=>{
          const out=computeNight(players,na);
          const P=id=>players.find(x=>x.id===id);
          const deadThisNight=out.dead.map(P).filter(Boolean);
          const mereT=P(na.mereTarget);
          return(
          <div className="nscard tr" style={{gap:'12px'}}>
            <span className="nse">📜</span>
            <h2 className="nsn">Récap de la Nuit</h2>

                        {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='SINGE_SAVANT'?` (${ROLES[p.role]?.name})`:''}</option>)}
                      </select>

                    {na.singeOut&&<>
                      {tg.map((t,i)=>{
                        const tp=players.find(p=>p.id===t.id);
                        return(
                          <div key={t.id} className="srow">
                            <div className="srow-n">{i+1}. {tp?.name} <span>({tp?.role?ROLES[tp.role]?.name:'rôle pas encore attribué'})</span></div>

                              ?<div className="srow-q"><button onClick={()=>setWolf(i,false)}>Villageois</button><button onClick={()=>setWolf(i,true)}>Loup</button></div>

                            {i===tg.length-1&&<button className="srow-x" onClick={()=>setNA({singeTargets:tg.slice(0,-1)})} aria-label="Annuler">✕</button>}
                          </div>

                      {found
                        ?<div className="nscfm r">🐺 Il a découvert un Loup-Garou — le Singe Savant meurt</div>
                        :!pending&&(
                          <select className="nssel" value="" onChange={e=>{
                            const id=parseInt(e.target.value);if(!id) return;
                            const tp=players.find(p=>p.id===id);
                            setNA({singeTargets:[...tg,{id,wolf:tp?.role?isWolf(tp):null}]});
                          }}>
                            <option value="">{tg.length===0?'— Quelle maison visite-t-il ? —':'— Visiter une autre maison (facultatif) —'}</option>
                            {players.filter(p=>p.alive&&p.id!==singe.id&&!tg.some(t=>t.id===p.id)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                          </select>
                        )}
                    </>}
                  </>}
                </div>
              );
            })()}

            {/* PUISSANTE MÈRE DES LOUPS */}
            {role==='PUISSANTE_MERE'&&(()=>{
              const mere=players.find(p=>p.role==='PUISSANTE_MERE'&&p.alive);
              const tgt=players.find(p=>p.id===na.mereTarget);
              const eff=hasVillagePower(tgt);
              return(
                <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                  {isFirstNight&&<>
                      <div className="nslbl">Qui joue ce rôle ?</div>
                      <select className="nssel" value={players.find(p=>p.role==='PUISSANTE_MERE'&&p.alive)?.id||''} onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'PUISSANTE_MERE');}}>
                        <option value="">— Sélectionner —</option>
                        {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='PUISSANTE_MERE'?` (${ROLES[p.role]?.name})`:''}</option>)}
                      </select>
                      <div className="nsdiv"/>
                    </>}
                  {!isFirstNight&&mere&&<div className="nscfm r">👑 {mere.name}</div>}
                  {!mere?<div className="nsoff">Mère des Loups non identifiée</div>:<>
                    <div className="nslbl">Quel joueur désigne-t-elle ?</div>
                    <select className="nssel" value={na.mereTarget||''} onChange={e=>setNA({mereTarget:parseInt(e.target.value)||null})}>
                      <option value="">— Ne désigne personne —</option>
                      {players.filter(p=>p.alive&&p.id!==mere.id).map(p=><option key={p.id} value={p.id}>{p.name}{p.role?` (${ROLES[p.role]?.name})`:''}</option>)}
                    </select>
                    {tgt&&(eff
                      ?<div className="nscfm r">⛔ {tgt.name} perd son pouvoir — réveillez-le discrètement pour le lui signaler</div>
                      :!tgt.role
                        ?<div className="nscfm a">Rôle pas encore attribué : il perdra son pouvoir si c'est un Villageois à pouvoir</div>
                        :<div className="nscfm a">Aucun effet ({isWolf(tgt)?"c'est un Loup":'pas de pouvoir à retirer'})</div>)}
                  </>}
                </div>
              );
            })()}

            {/* COLOSSE : riposte en fin de nuit */}
            {role==='COLOSSE_RIPOSTE'&&(()=>{
              const out=computeNight(players,na);
              const col=players.find(p=>p.role==='COLOSSE'&&p.alive);
              if(!col) return <div className="nsoff">Colosse non identifié</div>;
              if(isPowerless(col,na)) return <div className="nsoff">Pouvoir supprimé — pas de riposte</div>;
              if(!out.colosseDevoured) return <div className="nsoff">{col.name} n'a pas été dévoré cette nuit — ne pas le réveiller</div>;
              const wolves=players.filter(p=>p.alive&&isWolf(p));
              return(
                <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                  <div className="vtbox"><div className="vtlbl">Dévoré cette nuit</div><div className="vtnm">{col.name}</div></div>
                  <div className="nslbl">Montrez-lui les Loups-Garous</div>
                  <div className="nstags">{wolves.map(p=><span key={p.id} className="nstag wf">{ROLES[p.role]?.emoji} {p.name}</span>)}</div>
                  <div className="nslbl">Lequel emporte-t-il ?</div>
                  <select className="nssel" value={na.colosseTarget||''} onChange={e=>setNA({colosseTarget:parseInt(e.target.value)||null})}>
                    <option value="">— Choisir un Loup —</option>
                    {wolves.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  {na.colosseTarget&&<div className="nscfm r">💪 {players.find(p=>p.id===na.colosseTarget)?.name} meurt avec lui</div>}
                </div>
              );
            })()}

            {/* INFECT PÈRE DES LOUPS */}
            {role==='INFECT_PERE'&&(
              <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                {isFirstNight&&(
                  <>
                    <div className="nslbl">Qui joue ce rôle ?</div>
                    <select className="nssel"
                      value={players.find(p=>p.role==='INFECT_PERE'&&p.alive)?.id||''}
                      onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'INFECT_PERE');}}>
                      <option value="">— Sélectionner —</option>
                      {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='INFECT_PERE'?` (${ROLES[p.role]?.name})`:''}</option>)}
                    </select>
                    {players.find(p=>p.role==='INFECT_PERE'&&p.alive)&&<div className="nscfm g">✓ {players.find(p=>p.role==='INFECT_PERE'&&p.alive).name}</div>}
                    <div className="nsdiv"/>
                  </>
                )}
                {!isFirstNight&&players.find(p=>p.role==='INFECT_PERE'&&p.alive)&&(
                  <div className="nscfm g" style={{marginBottom:'4px'}}>🦠 {players.find(p=>p.role==='INFECT_PERE'&&p.alive).name}</div>

                {(()=>{
                  const infectP=players.find(p=>p.role==='INFECT_PERE'&&p.alive);
                  if(infectP?.infectUsed) return(
                    <div style={{padding:'10px',borderRadius:'12px',background:'rgba(26,16,8,.06)',border:'1px dashed rgba(26,16,8,.2)',textAlign:'center',fontFamily:"'Cinzel',serif",fontSize:'10px',color:'rgba(26,16,8,.38)',letterSpacing:'.08em'}}>
                      🦠 Pouvoir déjà utilisé cette partie
                    </div>
                  );
                  const victim=players.find(p=>p.id===na.wolfVictim);
                  if(!victim) return(
                    <div style={{fontFamily:"'IM Fell English',serif",fontSize:'12px',fontStyle:'italic',color:'rgba(26,16,8,.45)',textAlign:'center'}}>
                      Aucune victime désignée par les loups
                    </div>
                  );
                  return(
                    <>
                      <div className="vtbox">
                        <div className="vtlbl">Victime des loups cette nuit</div>

                      </div>
                      <div className="nslbl">Transformer en loup ?</div>
                      <div style={{display:'flex',gap:'8px'}}>
                        <button
                          onClick={()=>setNA({infectTransform:true})}
                          style={{flex:1,padding:'12px 8px',borderRadius:'12px',border:`2px solid ${na.infectTransform?'var(--blood)':'rgba(26,16,8,.15)'}`,background:na.infectTransform?'rgba(139,26,26,.18)':'rgba(26,16,8,.04)',fontFamily:"'Cinzel',serif",fontSize:'11px',color:na.infectTransform?'var(--blood)':'rgba(26,16,8,.4)',cursor:'pointer',textAlign:'center',transition:'all .15s'}}>

                        </button>
                        <button
