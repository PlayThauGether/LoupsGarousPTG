                              <span style={{fontSize:'22px'}}>{r.emoji}</span>
                              <span style={{fontFamily:"inherit",fontSize:'13px',color:chosen?'var(--ink)':'rgba(var(--ink-rgb),.69)',textAlign:'center',lineHeight:1.2}}>{r.name}</span>
                            </div>
                          );
                        })}
                      </div>
                      {voleurChosenRole&&ROLES[voleurChosenRole]&&(
                        <div className="nscfm g">✓ {voleurP.name} devient {ROLES[voleurChosenRole]?.emoji} {ROLES[voleurChosenRole]?.name}</div>
                      )}
                    </>
                  );
                })()}
              </div>
            )}

            {/* ENFANT SAUVAGE : assignation + modèle */}
            {role==='ENFANT_SAUVAGE'&&(
              <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                {isFirstNight&&(
                  <>
                    <div className="nslbl">Qui joue ce rôle ?</div>
                    <ChipSelect className="nssel"
                      value={players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive)?.id||''}
                      onChange={e=>{
                        const id=parseInt(e.target.value);
                        if(id) setPlayers(prev=>prev.map(p=>p.id===id?{...p,role:'ENFANT_SAUVAGE',team:'variable'}:p));
                      }}>
                      <option value="">— Sélectionner un joueur —</option>
                      {players.filter(p=>p.alive).map(p=>(
                        <option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='ENFANT_SAUVAGE'?` (${ROLES[p.role]?.name})`:''}</option>
                      ))}
                    </ChipSelect>
                    {players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive)&&(
                      <div className="nscfm g">✓ {players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive).name}</div>
                    )}
                  </>
                )}
                {players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive)&&(
                  <>
                    <div className="nsdiv"/>
                    <div className="nslbl">🌿 Qui est son modèle ?</div>
                    <ChipSelect className="nssel"
                      value={players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive)?.model||''}
                      onChange={e=>{
                        const mid=parseInt(e.target.value)||null;
                        const esId=players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive)?.id;
                        if(esId) setPlayers(prev=>prev.map(p=>p.id===esId?{...p,model:mid}:p));
                      }}>
                      <option value="">— Choisir un modèle —</option>
                      {players.filter(p=>p.alive&&p.role!=='ENFANT_SAUVAGE').map(p=>(
                        <option key={p.id} value={p.id}>{p.name}{p.role?` (${ROLES[p.role]?.name})`:''}</option>
                      ))}
                    </ChipSelect>
                    {players.find(p=>p.role==='ENFANT_SAUVAGE'&&p.alive)?.model&&(
                      <div className="nscfm g">🌿 Modèle : {players.find(p=>p.id===players.find(x=>x.role==='ENFANT_SAUVAGE'&&x.alive)?.model)?.name}</div>
                    )}
                  </>
                )}
              </div>
            )}

            {/* SINGE SAVANT */}
            {role==='SINGE_SAVANT'&&(()=>{
              const singe=players.find(p=>p.role==='SINGE_SAVANT'&&p.alive);
              const tg=na.singeTargets||[];
              const found=tg.some(t=>t.wolf===true);
              const pending=tg.some(t=>t.wolf===null);
              const setWolf=(i,w)=>setNA({singeTargets:tg.map((t,j)=>j===i?{...t,wolf:w}:t)});
              return(
                <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                  {isFirstNight&&<>
                      <div className="nslbl">Qui joue ce rôle ?</div>
                      <ChipSelect className="nssel" value={players.find(p=>p.role==='SINGE_SAVANT'&&p.alive)?.id||''} onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'SINGE_SAVANT');}}>
                        <option value="">— Sélectionner —</option>
                        {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='SINGE_SAVANT'?` (${ROLES[p.role]?.name})`:''}</option>)}
                      </ChipSelect>
                      <div className="nsdiv"/>
                    </>}
                  {!isFirstNight&&singe&&<div className="nscfm g">🐒 {singe.name}</div>}
                  {!singe?<div className="nsoff">Singe Savant non identifié</div>
                  :singe.singeUsed?<div className="nsoff">Pouvoir déjà utilisé — appelez-le quand même, puis rendormez-le</div>
                  :<>
                    <div className="nslbl">Sort-il de sa cage cette nuit ?</div>
                    <div className="nschoice">
                      <button className={`nsopt${!na.singeOut?' on g':''}`} onClick={()=>setNA({singeOut:false,singeTargets:[]})}>Reste dans sa cage</button>
                      <button className={`nsopt${na.singeOut?' on a':''}`} onClick={()=>setNA({singeOut:true})}>Sort cette nuit</button>
                    </div>
                    {na.singeOut&&<>
                      {tg.map((t,i)=>{
                        const tp=players.find(p=>p.id===t.id);
                        return(
                          <div key={t.id} className="srow">
                            <div className="srow-n">{i+1}. {tp?.name} <span>({tp?.role?ROLES[tp.role]?.name:'rôle pas encore attribué'})</span></div>
                            {t.wolf===null
                              ?<div className="srow-q"><button onClick={()=>setWolf(i,false)}>Villageois</button><button onClick={()=>setWolf(i,true)}>Loup</button></div>
                              :<div className={`srow-r ${t.wolf?'r':'g'}`}>{t.wolf?'Loup-Garou':'Villageois'}</div>}
                            {i===tg.length-1&&<button className="srow-x" onClick={()=>setNA({singeTargets:tg.slice(0,-1)})} aria-label="Annuler">✕</button>}
                          </div>
                        );
                      })}
                      {found
                        ?<div className="nscfm r">🐺 Il a découvert un Loup-Garou — le Singe Savant meurt</div>
                        :!pending&&(
                          <ChipSelect className="nssel" value="" onChange={e=>{
                            const id=parseInt(e.target.value);if(!id) return;
                            const tp=players.find(p=>p.id===id);
                            setNA({singeTargets:[...tg,{id,wolf:tp?.role?isWolf(tp):null}]});
                          }}>
                            <option value="">{tg.length===0?'— Quelle maison visite-t-il ? —':'— Visiter une autre maison (facultatif) —'}</option>
                            {players.filter(p=>p.alive&&p.id!==singe.id&&!tg.some(t=>t.id===p.id)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                          </ChipSelect>
                        )}
                    </>}
                  </>}
                </div>
              );
            })()}

            {/* PUISSANTE MÈRE DES LOUPS */}
            {role==='PUISSANTE_MERE'&&(()=>{
              const mere=players.find(p=>p.role==='PUISSANTE_MERE'&&p.alive);
              const tgt=players.find(p=>p.id===na.mereTarget);
              const eff=hasVillagePower(tgt);
              return(
                <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                  {isFirstNight&&<>
                      <div className="nslbl">Qui joue ce rôle ?</div>
                      <ChipSelect className="nssel" value={players.find(p=>p.role==='PUISSANTE_MERE'&&p.alive)?.id||''} onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'PUISSANTE_MERE');}}>
                        <option value="">— Sélectionner —</option>
                        {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='PUISSANTE_MERE'?` (${ROLES[p.role]?.name})`:''}</option>)}
                      </ChipSelect>
                      <div className="nsdiv"/>
                    </>}
                  {!isFirstNight&&mere&&<div className="nscfm r">👑 {mere.name}</div>}
                  {!mere?<div className="nsoff">Mère des Loups non identifiée</div>:<>
                    <div className="nslbl">Quel joueur désigne-t-elle ?</div>
                    <ChipSelect className="nssel" value={na.mereTarget||''} onChange={e=>setNA({mereTarget:parseInt(e.target.value)||null})}>
                      <option value="">— Ne désigne personne —</option>
                      {players.filter(p=>p.alive&&p.id!==mere.id).map(p=><option key={p.id} value={p.id}>{p.name}{p.role?` (${ROLES[p.role]?.name})`:''}</option>)}
                    </ChipSelect>
                    {tgt&&(eff
                      ?<div className="nscfm r">⛔ {tgt.name} perd son pouvoir — réveillez-le discrètement pour le lui signaler</div>
                      :!tgt.role
                        ?<div className="nscfm a">Rôle pas encore attribué : il perdra son pouvoir si c'est un Villageois à pouvoir</div>
                        :<div className="nscfm a">Aucun effet ({isWolf(tgt)?"c'est un Loup":'pas de pouvoir à retirer'})</div>)}
                  </>}
                </div>
              );
            })()}

            {/* COLOSSE : riposte en fin de nuit */}
            {role==='COLOSSE_RIPOSTE'&&(()=>{
              const out=computeNight(players,na);
              const col=players.find(p=>p.role==='COLOSSE'&&p.alive);
              if(!col) return <div className="nsoff">Colosse non identifié</div>;
              if(isPowerless(col,na)) return <div className="nsoff">Pouvoir supprimé — pas de riposte</div>;
              if(!out.colosseDevoured) return <div className="nsoff">{col.name} n'a pas été dévoré cette nuit — ne pas le réveiller</div>;
              const wolves=players.filter(p=>p.alive&&isWolf(p));
              return(
                <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                  <div className="vtbox"><div className="vtlbl">Dévoré cette nuit</div><div className="vtnm">{col.name}</div></div>
                  <div className="nslbl">Montrez-lui les Loups-Garous</div>
                  <div className="nstags">{wolves.map(p=><span key={p.id} className="nstag wf">{ROLES[p.role]?.emoji} {p.name}</span>)}</div>
                  <div className="nslbl">Lequel emporte-t-il ?</div>
                  <ChipSelect className="nssel" value={na.colosseTarget||''} onChange={e=>setNA({colosseTarget:parseInt(e.target.value)||null})}>
                    <option value="">— Choisir un Loup —</option>
                    {wolves.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </ChipSelect>
                  {na.colosseTarget&&<div className="nscfm r">💪 {players.find(p=>p.id===na.colosseTarget)?.name} meurt avec lui</div>}
                </div>
              );
            })()}

            {/* INFECT PÈRE DES LOUPS */}
            {role==='INFECT_PERE'&&(
              <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                {isFirstNight&&(
                  <>
                    <div className="nslbl">Qui joue ce rôle ?</div>
                    <ChipSelect className="nssel"
                      value={players.find(p=>p.role==='INFECT_PERE'&&p.alive)?.id||''}
                      onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'INFECT_PERE');}}>
                      <option value="">— Sélectionner —</option>
                      {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='INFECT_PERE'?` (${ROLES[p.role]?.name})`:''}</option>)}
                    </ChipSelect>
                    {players.find(p=>p.role==='INFECT_PERE'&&p.alive)&&<div className="nscfm g">✓ {players.find(p=>p.role==='INFECT_PERE'&&p.alive).name}</div>}
                    <div className="nsdiv"/>
                  </>
                )}
                {!isFirstNight&&players.find(p=>p.role==='INFECT_PERE'&&p.alive)&&(
                  <div className="nscfm g" style={{marginBottom:'4px'}}>🦠 {players.find(p=>p.role==='INFECT_PERE'&&p.alive).name}</div>
                )}
                {(()=>{
                  const infectP=players.find(p=>p.role==='INFECT_PERE'&&p.alive);
                  if(infectP?.infectUsed) return(
                    <div style={{padding:'10px',borderRadius:'16px',background:'rgba(var(--ink-rgb),.08)',border:'1px dashed rgba(var(--ink-rgb),.28)',textAlign:'center',fontFamily:"inherit",fontSize:'13px',color:'rgba(var(--ink-rgb),.47)',letterSpacing:'.08em'}}>
                      🦠 Pouvoir déjà utilisé cette partie
                    </div>
                  );
                  const victim=players.find(p=>p.id===na.wolfVictim);
                  if(!victim) return(
                    <div style={{fontFamily:"inherit",fontSize:'14px',fontStyle:'normal',color:'rgba(var(--ink-rgb),.56)',textAlign:'center'}}>
                      Aucune victime désignée par les loups
                    </div>
                  );
                  return(
                    <>
                      <div className="vtbox">
                        <div className="vtlbl">Victime des loups cette nuit</div>
                        <div className="vtnm">{victim.name} <span style={{fontSize:'15px',opacity:.6}}>({ROLES[victim.role]?.name})</span></div>
                      </div>
                      <div className="nslbl">Transformer en loup ?</div>
                      <div style={{display:'flex',gap:'8px'}}>
                        <button
                          onClick={()=>setNA({infectTransform:true})}
                          style={{flex:1,padding:'12px 8px',borderRadius:'16px',border:`2px solid ${na.infectTransform?'var(--blood)':'rgba(var(--ink-rgb),.21)'}`,background:na.infectTransform?'rgba(255,107,129,.16)':'rgba(var(--ink-rgb),.06)',fontFamily:"inherit",fontSize:'13px',color:na.infectTransform?'var(--blood)':'rgba(var(--ink-rgb),.50)',cursor:'pointer',textAlign:'center',transition:'all .15s'}}>
                          🦠 OUI<br/><span style={{fontSize:'12px',letterSpacing:'.08em'}}>devient loup</span>
                        </button>
                        <button
                          onClick={()=>setNA({infectTransform:false})}
                          style={{flex:1,padding:'12px 8px',borderRadius:'16px',border:`2px solid ${!na.infectTransform?'var(--green)':'rgba(var(--ink-rgb),.21)'}`,background:!na.infectTransform?'rgba(94,234,169,.10)':'rgba(var(--ink-rgb),.06)',fontFamily:"inherit",fontSize:'13px',color:!na.infectTransform?'var(--green)':'rgba(var(--ink-rgb),.50)',cursor:'pointer',textAlign:'center',transition:'all .15s'}}>
                          💀 NON<br/><span style={{fontSize:'12px',letterSpacing:'.08em'}}>meurt normalement</span>
                        </button>
                      </div>
                      {na.infectTransform&&<div className="nscfm r">🦠 {victim.name} rejoindra les loups !</div>}
                    </>
                  );
                })()}
              </div>
            )}

            {/* GRAND MÉCHANT LOUP */}
            {role==='GRAND_MECHANT_LOUP'&&(
              <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                {isFirstNight&&(
                  <>
                    <div className="nslbl">Qui joue ce rôle ?</div>
                    <ChipSelect className="nssel"
                      value={players.find(p=>p.role==='GRAND_MECHANT_LOUP'&&p.alive)?.id||''}
                      onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'GRAND_MECHANT_LOUP');}}>
                      <option value="">— Sélectionner —</option>
                      {players.filter(p=>p.alive).map(p=><option key={p.id} value={p.id}>{p.name}{p.role&&p.role!=='GRAND_MECHANT_LOUP'?` (${ROLES[p.role]?.name})`:''}</option>)}
                    </ChipSelect>
                    {players.find(p=>p.role==='GRAND_MECHANT_LOUP'&&p.alive)&&<div className="nscfm g">✓ {players.find(p=>p.role==='GRAND_MECHANT_LOUP'&&p.alive).name}</div>}
                    <div className="nsdiv"/>
                  </>
                )}
                {!isFirstNight&&players.find(p=>p.role==='GRAND_MECHANT_LOUP'&&p.alive)&&(
                  <div className="nscfm g" style={{marginBottom:'4px'}}>👹 {players.find(p=>p.role==='GRAND_MECHANT_LOUP'&&p.alive).name}</div>
                )}
                {(()=>{
                  // Un loup est mort = perd son pouvoir
                  const aWolfDied=players.some(p=>!p.alive&&isWolf(p));
                  if(aWolfDied) return(
                    <div style={{padding:'10px',borderRadius:'16px',background:'rgba(var(--ink-rgb),.08)',border:'1px dashed rgba(var(--ink-rgb),.28)',textAlign:'center',fontFamily:"inherit",fontSize:'13px',color:'rgba(var(--ink-rgb),.47)',letterSpacing:'.08em'}}>
                      👹 Pouvoir perdu — un loup est mort
                    </div>
                  );
                  return(
                    <>
                      <div className="nslbl">2ème victime (optionnel)</div>
                      <ChipSelect className="nssel"
                        value={na.gmgVictim||''}
                        onChange={e=>setNA({gmgVictim:parseInt(e.target.value)||null})}>
                        <option value="">— Ne pas utiliser —</option>
                        {players.filter(p=>p.alive&&!isWolf(p)&&p.id!==na.wolfVictim).map(p=>(
                          <option key={p.id} value={p.id}>{p.name} ({ROLES[p.role]?.name||'?'})</option>
                        ))}
                      </ChipSelect>
                      {na.gmgVictim&&<div className="nscfm r">👹 {players.find(p=>p.id===na.gmgVictim)?.name} sera aussi tué</div>}
                    </>
                  );
                })()}
              </div>
            )}

            {/* LOUP BLANC - nuit normale */}
            {role==='LOUP_BLANC'&&!isFirstNight&&(
              <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'8px'}}>
                {!lbActif?(
                  <div style={{textAlign:'center',padding:'12px',background:'rgba(var(--ink-rgb),.08)',borderRadius:'16px',border:'1px solid rgba(var(--ink-rgb),.17)'}}>
                    <div style={{fontSize:'32px',marginBottom:'6px'}}>😴</div>
                    <div style={{fontFamily:"inherit",fontSize:'13px',color:'rgba(var(--ink-rgb),.50)',letterSpacing:'.1em'}}>Le Loup Blanc ne se réveille pas cette nuit</div>
                  </div>
                ):(
                  <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                    <div style={{textAlign:'center',padding:'8px',background:'rgba(255,107,129,.07)',borderRadius:'16px',border:'1px solid rgba(255,107,129,.18)'}}>
                      <div style={{fontFamily:"inherit",fontSize:'13px',color:'var(--blood)',letterSpacing:'.1em',marginBottom:'4px'}}>NUIT ACTIVE — peut tuer</div>
                    </div>
                    <div className="nslbl">Tuer un joueur (optionnel)</div>
                    <ChipSelect className="nssel" value={na.loupBlancTarget||''} onChange={e=>setNA({loupBlancTarget:parseInt(e.target.value)||null})}>
                      <option value="">— Ne pas tuer —</option>
                      {players.filter(p=>p.alive&&p.role!=='LOUP_BLANC').map(p=><option key={p.id} value={p.id}>{p.name} ({ROLES[p.role]?.name||'?'})</option>)}
                    </ChipSelect>
                    {na.loupBlancTarget&&<div className="nscfm r">🗡️ {players.find(p=>p.id===na.loupBlancTarget)?.name}</div>}
                  </div>
                )}
              </div>
            )}

            {/* LOUPS */}
            {role==='LOUP'&&(
              <div style={{width:'100%',display:'flex',flexDirection:'column',gap:'10px'}}>
                <div>
                  {isFirstNight&&(()=>{
                    // Compteur : nombre total de rôles loups sélectionnés
                    // Total loups attendus : rôles sélectionnés + Chien-Loup s'il a rejoint les loups
                    const chienLoupJoinsWolves=players.some(p=>p.role==='CHIEN_LOUP'&&p.team==='loups');
                    const totalWolfRoles=(activeRoles['LOUP']||0)+(activeRoles['GRAND_MECHANT_LOUP']||0)+(activeRoles['INFECT_PERE']||0)+(activeRoles['PUISSANTE_MERE']||0)+(activeRoles['LOUP_BLANC']||0)+(chienLoupJoinsWolves?1:0);
                    const assignedWolves=getAssigned('LOUP').length;
                    const ok=assignedWolves>=totalWolfRoles;
                    return(
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                        <div className="nslbl" style={{margin:0}}>Loups dans la partie</div>
                        <div style={{fontFamily:"inherit",fontSize:'14px',fontWeight:'700',color:ok?'var(--green)':'var(--blood)',background:ok?'rgba(94,234,169,.12)':'rgba(255,107,129,.14)',border:`1px solid ${ok?'var(--green)':'var(--blood)'}`,borderRadius:'16px',padding:'2px 10px'}}>
                          {assignedWolves} / {totalWolfRoles}
                        </div>
                      </div>
                    );
                  })()}
                  {!isFirstNight&&<div className="nslbl">Loups dans la partie</div>}
                  {getAssigned('LOUP').length>0
                    ?<div className="nstags" style={{marginTop:'6px'}}>{getAssigned('LOUP').map(p=><span key={p.id} className="nstag wf">{ROLES[p.role]?.emoji} {p.name}</span>)}</div>
                    :<div style={{fontFamily:"inherit",fontSize:'14px',fontStyle:'normal',color:'rgba(var(--ink-rgb),.50)',textAlign:'center',marginTop:'6px'}}>Aucun loup assigné</div>
                  }
                  {/* "Ajouter un loup" seulement en 1ère nuit */}
                  {isFirstNight&&(
                    <ChipSelect className="nssel" style={{marginTop:'8px'}} value="" onChange={e=>{const id=parseInt(e.target.value);if(id)assignRole(id,'LOUP');}}>
                      <option value="">➕ Ajouter un loup...</option>
                      {players.filter(p=>p.alive&&!isWolf(p)).map(p=><option key={p.id} value={p.id}>{p.name}{p.role?` (${ROLES[p.role]?.name})`:''}</option>)}
                    </ChipSelect>
                  )}
                </div>
                <div className="nsdiv"/>
                <div>
                  <div className="nslbl">🩸 Qui les loups dévorent ?</div>
                  <ChipSelect className="nssel" style={{marginTop:'6px'}} value={na.wolfVictim||''} onChange={e=>setNA({wolfVictim:parseInt(e.target.value)||null})}>
                    <option value="">— Choisir une victime —</option>
                    {players.filter(p=>p.alive&&!isWolf(p)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </ChipSelect>
                  {na.wolfVictim&&<div className="nscfm r">🩸 {players.find(p=>p.id===na.wolfVictim)?.name}</div>}
                </div>
              </div>
            )}

            {/* CUPIDON */}
            {role==='CUPIDON'&&(

                  <div className="nstags">
                    {permanent.map(p=><span key={p.id} className="nstag pk">🎵 {p.name}</span>)}
                    {newOnes.map(p=><span key={p.id} style={{padding:'4px 10px',borderRadius:'20px',fontFamily:"inherit",fontSize:'14px',border:'1px solid var(--purple)',background:'rgba(196,181,255,.12)',color:'var(--purple)'}}>✨ {p.name} <span style={{fontSize:'13px',opacity:.7}}>(cette nuit)</span></span>)}
                  </div>
                  <div style={{fontFamily:"inherit",fontSize:'13px',letterSpacing:'.1em',color:'rgba(var(--ink-rgb),.56)',textAlign:'center'}}>
                    {allCharmed.length} joueur{allCharmed.length>1?'s':''} charmé{allCharmed.length>1?'s':''} au total
                  </div>
                </div>
              );
            })()}
            </>}
            {/* Fin des blocs d'action */}

          </div>
        )}

      </div>{/* fin nsbody */}
      <div className="nsnav">
        <button className="nsbtn pv" disabled={idx===0} onClick={()=>setIdx(i=>i-1)}>← Préc.</button>
        {!isRecap?<button className="nsbtn nx" onClick={()=>setIdx(i=>i+1)}>Suivant →</button>:<button className="nsbtn fn" onClick={onFinish}>✓ Appliquer & Terminer</button>}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>

<!-- ── SERVICE WORKER & PWA INSTALL ── -->
<script>
// Enregistrement du Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/LoupsGarousPTG/sw.js', { scope: '/LoupsGarousPTG/' })
      .then(reg => {
        console.log('[PWA] SW OK:', reg.scope);
        reg.update();
      })
      .catch(err => console.warn('[PWA] SW erreur:', err.message));
  });
}

// Bouton "Installer l'application" (Android / Chrome)
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  const btn=document.getElementById('pwa-install-btn');
  if(btn) btn.style.display='flex';
});
function installPWA(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{
    deferredPrompt=null;
    const btn=document.getElementById('pwa-install-btn');
    if(btn) btn.style.display='none';
  });
}
window.addEventListener('appinstalled',()=>{
  const btn=document.getElementById('pwa-install-btn');
  if(btn) btn.style.display='none';
  deferredPrompt=null;
});

// Bannière iPhone / iPad (Safari ne propose pas l'installation automatique)
(function(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
  if(!isIOS||isStandalone) return;
  setTimeout(()=>{
    const banner=document.createElement('div');
    banner.id='ios-install-banner';
    banner.innerHTML='<div style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(var(--card2-rgb),.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.14);position:fixed;bottom:0;left:0;right:0;z-index:9999;padding-bottom:max(14px,env(safe-area-inset-bottom));font-family:Outfit,system-ui,sans-serif;">'
      +'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:var(--ink);">Installer l\'application</div>'
      +'<div style="font-size:13px;color:var(--muted);margin-top:2px;">Appuyez sur Partager puis « Sur l\'écran d\'accueil »</div></div>'
      +'<button onclick="document.getElementById(\'ios-install-banner\').remove()" style="width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.1);border:none;color:var(--ink);font-size:16px;cursor:pointer;">✕</button></div>';
    document.body.appendChild(banner);
  },3000);
})();
</script>

<div id="pwa-install-btn" onclick="installPWA()" style="display:none;position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9999;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-acc);border:none;border-radius:999px;padding:13px 24px;font-family:Outfit,system-ui,sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 12px 34px rgba(var(--acc2-rgb),.5);align-items:center;gap:8px;">Installer l'application</div>
</body>
</html>
